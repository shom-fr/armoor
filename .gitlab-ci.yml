image: condaforge/miniforge3:latest

stages:
  - setup
  - tests
  - doc

variables:
  MPLBACKEND: agg

before_script:
  - apt-get update > /dev/null
  - apt-get install -y make > /dev/null
  - hash -r

setup:
  stage: setup
  script:
    - conda config --set always_yes yes --set changeps1 no
    - conda info -a
    - test -d armoor_env || (conda create -p armoor_env python=3.11; source activate ./armoor_env; conda install -c conda-forge mamba; mamba install -c conda-forge --file requirements.txt; pip install .; conda deactivate)
    - source activate ./armoor_env
  cache:
    paths:
      - armoor_env/

tests:
  stage: tests
  script:
    - source activate ./armoor_env
    - export PYTHONPATH=$PWD
    - pip install ".[test]"
    - conda list | grep -Ei '^(xoa|numpy|xarray|dask|esmf|esmpy|xesmf|cftime|h5py|h5netcdf|netcdf4)\b'
    - pytest -v -s armoor/tests/uni
    - pytest -v -s armoor/tests/integration
  cache:
    paths:
      - armoor_env/
    policy: pull

pages:
  stage: doc
  script:
    - source activate ./armoor_env
    - export PYTHONPATH=$PWD
    - pip install ".[doc]"
    - cd doc
    - make html
    - cd ..
    - rm -rf public
    - cp -r doc/_build/html public
  artifacts:
    paths:
      - public
  cache:
    paths:
      - armoor_env/
    policy: pull
