image: continuumio/miniconda3:latest

stages:
  - setup
  - doc
  - tests

variables:
  MPLBACKEND: agg

before_script:
  - apt-get update > /dev/null
  - apt-get install -y make > /dev/null
  - hash -r

setup:
  stage: setup
  script:
    - conda config --set always_yes yes --set changeps1 no
    - conda info -a
    - test -d armoor_env || conda env create -f environment.yml -p armoor_env
    - source activate ./armoor_env
  cache:
    paths:
      - armoor_env/

tests:
  stage: tests
  script:
    - source activate ./armoor_env
    - export PATH=$PWD/bin:$PATH
    - export PYTHONPATH=$PWD
    - conda install pytest
    - cd armoor/tests/uni
    - pytest 
  cache:
    paths:
      - armoor_env/
    policy: pull

pages:
  stage: doc
  script:
    - source activate ./armoor_env
    - export PATH=$PWD/bin:$PATH
    - export PYTHONPATH=$PWD
    - cd docs
    - make html
    - cd ..
    - rm -rf public
    - cp -r docs/_build/html public
  artifacts:
    paths:
      - public
  cache:
    paths:
      - armoor_env/
    policy: pull
