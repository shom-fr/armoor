image: continuumio/miniconda3:latest

stages:
  - setup

variables:
  MPLBACKEND: agg

before_script:
  - apt-get update > /dev/null
  - apt-get install -y make > /dev/null
  - hash -r

setup:
  stage: setup
  script:
    - conda config --set always_yes yes --set changeps1 no
    - conda info -a
    - test -d armoor_env || conda env create -f enviroment.yml -p armoor_env
    - source activate ./armoor_env
  cache:
    paths:
      - armoor_env/
