image: condaforge/miniforge3:latest

stages:
  - setup
  - tests
  - doc

variables:
  MPLBACKEND: agg
  # Redirects cartopy's (and other XDG-aware tools') download cache into
  # armoor_env/, so it rides along the existing armoor_env/ cache and
  # doesn't need re-downloading (from Natural Earth) in every job/pipeline.
  XDG_DATA_HOME: $CI_PROJECT_DIR/armoor_env/share

before_script:
  - apt-get update > /dev/null
  - apt-get install -y make > /dev/null
  - hash -r

setup:
  stage: setup
  script:
    - conda config --set always_yes yes --set changeps1 no
    - conda info -a
    - test -d armoor_env || (conda create -p armoor_env python=3.11; source activate ./armoor_env; conda install -c conda-forge mamba; mamba install -c conda-forge --file requirements.txt; pip install .; conda deactivate)
    - source activate ./armoor_env
    # Run at each pipeline, not only when armoor_env/ is created, so that the
    # git-based dependencies (xoa, woom and shoot) follow their branches
    # instead of staying at the commit of the cached environment.
    - pip install .
    # Force cartopy's Natural Earth shapefile download now (into
    # $XDG_DATA_HOME/cartopy, i.e. inside the cached armoor_env/) rather
    # than lazily the first time a doc-build notebook plots a map.
    - python -c "import cartopy.feature as cfeature; list(cfeature.LAND.geometries())"
  cache:
    paths:
      - armoor_env/

tests:
  stage: tests
  script:
    - source activate ./armoor_env
    - export PYTHONPATH=$PWD
    - pytest -v -s tests/uni
    - pytest -v -s tests/integration/test_armoor_woom.py
  cache:
    paths:
      - armoor_env/
    policy: pull

pages:
  stage: doc
  script:
    - source activate ./armoor_env
    - export PYTHONPATH=$PWD
    - pip install ".[doc]"
    - cd doc
    - make html
    - cd ..
    - rm -rf public
    - cp -r doc/_build/html public
  artifacts:
    paths:
      - public
  cache:
    paths:
      - armoor_env/
    policy: pull
