image: continuumio/miniconda3:latest

stages:
  - setup
  - tests
  - doc

variables:
  MPLBACKEND: agg

before_script:
  - apt-get update > /dev/null
  - apt-get install -y make > /dev/null
  - hash -r

setup:
  stage: setup
  script:
    - conda config --set always_yes yes --set changeps1 no
    - conda info -a
    - test -d armoorenv || conda env create -f environment.yml -p armoorenv
    - source activate ./armoorenv
    - conda list
  only:
      - noveltis
  cache:
    paths:
      - armoorenv/

tests:
  stage: tests
  script:
    - source activate ./armoorenv
    - export PATH=$PWD/bin:$PATH
    - export PYTHONPATH=$PWD
    - cd tests
    - pytest
  only:
    - noveltis
  cache:
    paths:
      - armoorenv/
    policy: pull

pages:
  stage: doc
  script:
    - source activate ./armoorenv
    - export PATH=$PWD/bin:$PATH
    - export PYTHONPATH=$PWD
    - cd docs
    - make html
    - cd ..
    - rm -rf public
    - cp -r doc/_build/html public
  only:
    - noveltis
  artifacts:
    paths:
      - public
  cache:
    paths:
      - armoorenv/
    policy: pull
