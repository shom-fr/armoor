[config_reg]
    name = "hycom3d_indien"

[parameters]

    [[SEA_SURFACE_TEMPERATURE]]
    name = "1- température de surface"
        [[[param_1]]]
            name = SST modèle
            func = visu_temp
            var = sst
        [[[param_2]]]
            name = "Ecart de la SST modèle avec la SST satellite"
            func = visu_diff_sst
            var = sst
            obs = sstl4
        [[[param_3]]]
            name = Champ de vent ayant forcé le modèle
            func = visu_windforcing
            var = uv
            forcing_model = "atmfrc/insta"
            rarification = 10
        [[[param_4]]]
            name = Champ de flux solaire ayant forcé le modèle
            func = visu_solarflux
            var = hfsen
            forcing_model = "atmfrc/cumul"

    [[SEA_SURFACE_SALINITY]]
    name = "2- salinité de surface"
        [[[param_1]]]
            name = SSS modèle
            func = visu_sal
            var = sss
        [[[param_2]]]
            name = Ecart de la SSS modèle avec une climatologie
            func = visu_diff_sss
            var = sss
            obs = woa18
        [[[param_3]]]
            name = Débits des fleuves
            func = visu_runoff
            var = RVFL
            forcing_model = rivers
        [[[param_4]]]
            name = Précipitations
            func = visu_precip
            var = tp
            forcing_model = "atmfrc/cumul"

    [[MIXED_LAYER]]
    name = "3- couche de mélange"
        [[[param_1]]]
            name = Epaisseur de la couche de mélange modèle
            func = visu_mixedlayer
            var = temp
        [[[param_2]]]
            name = Epaisseur de la couche de mélange climatologie
            func = visu_mixedlayer_clim
            var = temp
            forcing_model = woa18
            multiprocess = False
        [[[param_3]]]
            name = Champ de flux solaire ayant forcé le modèle
            func = visu_solarflux
            var = hfsen
            forcing_model = "atmfrc/cumul"
        [[[param_4]]]
            name = Champ de vent ayant forcé le modèle
            func = visu_windforcing
            var = uv
            forcing_model = "atmfrc/insta"
            rarification = 10

    [[CURRENT]]
    name = "4- courant"
        [[[param_1]]]
            name = Courant modèle de surface
            func = visu_current
            var = suv
            rarification = 20
        [[[param_2]]]
            name = Courant modèle à 50 m
            func = visu_current
            var = uv
            depth = 50
            rarification = 20
        [[[param_3]]]
            name = Courant modèle à 100 m
            func = visu_current
            var = uv
            depth = 100
            rarification = 20
        [[[param_4]]]
            name = Courant modèle à 200 m
            func = visu_current
            var = uv
            depth = 200
            rarification = 20

    [[TEMPERATURE]]
    name = "5- température"
        [[[param_1]]]
            name = SST modèle
            func = visu_temp
            var = sst
        [[[param_2]]]
            name = Température modèle à 50 m
            func = visu_temp
            var = temp
            depth = 50
        [[[param_3]]]
            name = Température modèle à 100 m
            func = visu_temp
            var = temp
            depth = 100
        [[[param_4]]]
            name = Température modèle à 200 m
            func = visu_temp
            var = temp
            depth = 200

    [[OUTFLOW_PERS_TEMP]]
    name = "8- outflow persique et mer Rouge - température"
        [[[param_1]]]
            name = Température modèle à 200 m
            func = visu_temp
            var = temp
            depth = 200
        [[[param_2]]]
            name = Température modèle à 300 m
            func = visu_temp
            var = temp
            depth = 300
        [[[param_3]]]
            name = Température modèle à 700 m
            func = visu_temp
            var = temp
            depth = 700
        [[[param_4]]]
            name = Température modèle à 800 m
            func = visu_temp
            var = temp
            depth = 800

    [[OUTFLOW_PERS_SAL]]
    name = "9- outflow persique et mer Rouge - salinité"
        [[[param_1]]]
            name = Salinité modèle à 200 m
            func = visu_sal
            var = sal
            depth = 200
        [[[param_2]]]
            name = Salinité modèle à 300 m
            func = visu_sal
            var = sal
            depth = 300
        [[[param_3]]]
            name = Salinité modèle à 700 m
            func = visu_sal
            var = sal
            depth = 700
        [[[param_4]]]
            name = Salinité modèle à 800 m
            func = visu_sal
            var = sal
            depth = 800