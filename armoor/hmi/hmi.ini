[parameters]
    [[__many__]]
    name = string(default=None)
        [[[extent]]]
            lon_min = float(default=None)
            lon_max = float(default=None)
            lat_min = float(default=None)
            lat_max = float(default=None)
        [[[__many__]]]
            name = string(default=None)
            func = option(visu_temp, visu_sal, visu_current, visu_diff_sst, visu_windforcing, visu_solarflux, visu_diff_sss, visu_runoff, visu_precip, visu_mixedlayer, visu_mixedlayer_clim, default=None)
            var = option(temp, sst, uv, suv, sal, sss, hfsen, RVFL, tp, default=None)
            obs = string(default=None)
            depth = float(default=None)
            forcing_model = string(default=None)
            rarification = integer(default=1)
            barbs_length = float(default=4.0)
            barbs_linewidth = float(default=0.3)
            quiver_scale = float(default=None)
            quiver_width = float(default=None)
            quiver_headwidth = float(default=3.0)
            quiver_headlength = float(default=5.0)
            multiprocess = boolean(default=True)

[config_reg]
    model = string(default=None)
    config = string(default=None)