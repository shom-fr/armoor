[register]
name=cmems_argo
    [[attrs]]
    DATA_ID=CMEMS_ARGO
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[coords]
    [[lon]]
    name=LONGITUDE
    [[lat]]
    name=LATITUDE
    [[level]]
    name=N_LEVELS
    [[time]]
    name=TIME
[data_vars]
    [[pres]]
    name=PRES
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL
    [[temp_qc]]
    name=TEMP_QC
    [[sal_qc]]
    name=PSAL_QC
    [[pres_qc]]
    name=PRES_QC