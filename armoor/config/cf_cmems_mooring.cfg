[register]
name=cmems_mooring
    [[attrs]]
    DATA_ID=CMEMS_MOORING
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL
    [[depth]]
    name=DEPH
    [[depth_qc]]
    name=DEPH_QC
    
[coords]
    [[lat_precise]]
    name=PRECISE_LATITUDE
    [[lon_precise]]
    name=PRECISE_LONGITUDE
    [[lon]]
    name=LONGITUDE
    [[lat]]
    name=LATITUDE
    [[level]]
    name=N_LEVELS
    [[time]]
    name=TIME

    