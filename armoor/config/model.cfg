[register]
name=cmems
    [[attrs]]
    DATA_ID=CMEMS
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[ptemp]]
    alt_names=thetao,temperature,temp
    [[sal]]
    alt_names=so,salinity,salt,saln
    [[u]]
    alt_names=uo,u,U
    [[v]]
    alt_names=vo,v,V
    [[ssh]]
    alt_names=zos,ssh
[coords]
    [[lon]]
    alt_names=longitude,lon
    [[lat]]
    alt_names=latitude,at
    [[depth]]
    name=depth
    [[time]]
    name=time
