[register]
name=cmems_drifter
    [[attrs]]
    DATA_ID=CMEMS_DRIFTER
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL
    
[coords]
    [[lon]]
    name=LONGITUDE
    [[lat]]
    name=LATITUDE
    [[level]]
    name=N_LEVELS
    [[time]]
    name=TIME
    [[depth]]
    name=DEPH

