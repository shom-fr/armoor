[report]
    title = string
    format = option('pdf', 'html')

[functionalities]
    [[__many__]]
        path_to_config = path
        meta_zones = force_list

[meta_zones]
    [[__many__]]
        name = string(default=Meta-zone)
        start = absolute_or_relative_time(default=None)
        end = absolute_or_relative_time(default=None)
        radius = float(default=None)
        polygon = coordinates(default=None)
        cloud = coordinates(default=None)
        times = force_list(default=None)
        time-highlight = force_list(default=None)
        interval = string(default=None)
        quality = list(default=None)
        depth = depth(default=None)
        bathy_min = float(default=None)
        bathy_max = float(default=None)
        density = density(default=None)
        time-restriction = int_list(min=2, max=2, default=None)
        vars = vars_list(default=None)
        cyclic = force_list(default=None)

[meta_zone_desc]
    polygon = string(default="Sélection horizontale : Polygone")
    bathy_min = string(default="Sélection horizontale : Bathymétrie seuil minimal")
    bathy_max = string(default="Sélection horizontale : Bathymétrie seuil maximal")
    cloud = string(default="Sélection horizontale : Nuage de points")
    radius = string(default="Sélection de nuage de points avec un disque de rayon")
    depth = string(default="Sélection vertivale : profondeur")
    density = string(default="Sélection vertivale : densité")
    start = string(default="Période temporelle : Début")
    end = string(default="Période temporelle : Fin")
    interval = string(default="Découpage temporel, par intervalle de :")
    times = string(default="Découpage temporel, par échéance :")
    time-highlight = string(default="Echéances temporels mises en avant :")
    quality = string(default="Seuils de qualité, min/max :")
    vars = string(default="Variables d'intéré :")
    cyclic = string(default="Sélection temporel climatologique :")
    time-restriction = string(default="Restriction de fenêtre temporelle :")
    slice = string(default="Découpage vertical par tranches")

[functionalities_desc]
    sst = string(default="Comparaison à la SST satellite")
    prof_hydro_vessel = string(default="Comparaison aux profils hydrologiques")
    prof_hydro_mooring = string(default="Comparaison aux mouillages fixes hydrologiques")
    section_hydro = string(default="Comparaison aux sections hydrologiques")
    clim_hydro = string(default="Comparaison à une climatologie observée d'hydrologie")
    currents_hfr = string(default="Comparaison des courants de surface aux observations radar HF")
    currents_ADCP = string(default="Comparaison aux mesures ADCP au point fixe")
    currents_VMADCP = string(default="Comparaison aux mesures VM-ADCP")
    drifters = string(default="Comparaison aux flotteurs dérivants")

[sub_functionalities_desc]
    diag_disp_g = string(default="Diagramme de dispersion global")
    plot_map_metr_biais = string(default="Carte de la métrique biais")
    plot_map_metr_ecart = string(default="Carte de la métrique écart")
    plot_map_metr_RMSEcentree = string(default="Carte de la métrique RMSE centrée")
    plot_map_metr_RMSEc = string(default="Carte de la métrique RMSE")
    plot_ts_metr_stats = string(default="Courbes temporelles statistiques")
    plot_ts_metr_ecart_point = string(default="Courbes temporelles statistiques - métrique écart")
    plot_ts_metr_point = string(default="Courbes temporelles ponctuelles")
    diag_disp = string(default="Diagramme de dispersion")
    diag_ts_multi = string(default="Diagramme theta-S multi-profil")
    diag_ts_unique = string(default="Diagramme theta-S profil unique")
    plot_profile_multi = string(default="Courbes multi profils de profils verticaux")
    plot_profile_u = string(default="Courbes profil unique de profils verticaux")
    plot_variable_2d = string(default="Variables 2D : courbes")
    plot_variable_3d = string(default="Variables 3D : graphes 2D")
    plot_tide_current_ellipses = string(default="Ellipses de courant de marée")
    plot_map_current_harmonic = string(default="Carte des composantes harmoniques de marée")
    harmonic_table = string(default="Tableau analyse harmonique de marée")
    plot_hovmoller = string(default="Diagramme de Hovmoller")
    plot_stick_plot = string(default="Diagramme stick plot")
    map_current_trajectroy = string(default="Carte des courants le long de la trajectoire")
    map_trajectroy = string(default="Carte de trajectoires")
    plot_diff_traj_dist = string(default="Courbes d'écarts en distance et en direction")


