[report]
    title = string
    format = option('pdf', 'html', 'all')

[functionalities]
    [[__many__]]
        path_to_config = path
        meta_zones = force_list

[meta_zones]
    [[__many__]]
        name = string(default=Meta-zone) # meta-zone name appearing in the title plots
        start = absolute_or_relative_time(default=None) # To consider only the dates from a given date. The dates can be relative (ex: -2, for two days ago) or absolute in the following format YYYY-MM-DDTHH:mm:ss
        end = absolute_or_relative_time(default=None) # To consider only the dates up to a given date
        polygon = coordinates(default=None) # To consider only the region inside the polygon defined by a list of points. For example : lon1=-2.72, lat1=47.20,  lat2=50.84, lon2=-4.74  etc simply type : --polygon 47.20,-2.72 50.84,-4.74 etc
        cloud = coordinates(default=None) # Cloud meta-zone defined by a set of coordinates. For example : lon1=-2.72, lat1=47.20,  lat2=50.84, lon2=-4.74  etc simply type : --cloud 47.20,-2.72 50.84,-4.74 etc
        radius = float(default=None) # Radius around the points to expand the considered area of the cloud
        times = force_list(default=None) # Only the dates from this list will be kept
        time_highlight = force_list(default=None) # The dates of this list will be highlighted in the time series
        interval = string(default=None) # To group into intervals: hour(s), day(s), month, season(s) or year(s).
        quality = list(default=None) # Minimum and maximum quality of data to take into account ex : q_var, q_min, q_max
        depth = force_list(default=None) # List of immersions to select
        depth_min = float(default=None) # Minimum authorized depth value
        depth_max = float(default=None) # Maximum authorized depth value
        density = density(default=None) # One, two or three arguments are allowed : One argument (density); two arguments (start_density, end_density); three arguments (start_density, end_density, step)
        slice = float_list(default=None) # List of depth or density levels defining the vertical slices
        bathy_min = float(default=None) # Minimum authorized bathymetry value
        bathy_max = float(default=None) # Maximum authorized bathymetry value
        time_restriction = int_list(min=2, max=2, default=None) # Two values for the start and end times. To consider only the times in between (may straddle two days)
        vars = options(temp, ptemp, SST, ssh, sal, dens, pdens, current, sndspd, gbt, mld, uv, sound_speed, geostrophic_current,  default=None) # To select the variables of interest
        cyclic = force_list(default=None) # This keyword makes it possible to consider only a period of the year expressed in months (january, february, march, april, may, june, july, august, september, october, november, december) or a series of several months ( between 2 and 11 consecutive letters from this list: JFMAMJJASOND)

