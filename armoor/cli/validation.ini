[metazones]
    [[__many__]]
    name = string()
    tbound = force_list()
    tfreq = string(default=None)
    trange_seq = strings(default=None)
    trange_clim = string(default=None)
    polygon = tuple(default=None)
    cloud = coordinates(default=None)
    href = option(reference, product, default=None)
    vlevel = dict(default=None)
    vrange = list(default=None)
    vfreq = dict(default=None)
    
[data]
    [[__many__]]
    name = string()
    path = paths()
    fmt = option(woa18, cmems_insitu, cora_insitu, cmems_sst_l4, cmems_sst_l3, cersat_sst_l3, hycom, croco, cmems_model)
    platform = option(argo, drifter, glider, mooring, default=None)
    ref = boolean(default=False)

[outputs]
    [[__many__]]
    fmt=options(netcdf, png)
    otype=option(comp_time_series, comp_diag_thetas, comp_map, comp_dispersion, comp_section, comp_multiprofiles, comp_profile)
    