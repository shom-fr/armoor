[header]
title = string(default="Ocean Forecast Qualification Bulletin")
subtitle = string(default="Annual Report")
# Optional path to a logo image (png, jpg, svg, gif) shown in the header
logo = string(default="")

[summary]
# Summary section appears after the header
overview = string(default="")
key_findings = string_list(default=list())
model_version = string(default="")
data_sources = string_list(default=list())
# Overridden by armoor-bull --period when given
period = string(default="")

[comparison_types]
# Each comparison type is a subsection with a description
    [[__many__]]
    description = string
    label = string(default="")

[zones]
# Each zone is a subsection with a description
    [[__many__]]
    description = string
    label = string(default="")

[ocean-features]
# Main ocean features per zone
# (upwelling, river plume, internal waves, fronts, ...)
title = string(default="Main ocean features")
    [[__many__]] # zone
    label = string(default="")
        [[[__many__]]] # feature (ex: Internal waves, Ushant front, River plume, Upwelling)
        label = string(default="")
        description = string(default="")

[images]
# Images organized by comparison type, output type and metazone
    [[__many__]] #type
    label = string(default="")
        [[[__many__]]] # section
        label = string(default="")
            [[[[__many__]]]] #output
            label = string(default="")
                [[[[[__many__]]]]] #metazone
                label = string(default="")
                path = string_list
