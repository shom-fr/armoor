[header]
title = string(default="Shom Ocean Forecast Qualification Bulletin")
subtitle = string(default="Annual Report")

[summary]
# Summary section appears after the header
introduction = string(default="")
conclusion = string_list(default=list())
version_modele = string(default="")
donnees_source = string_list(default=list())
periode = string(default="")

[comparison_types]
# Each comparison type is a subsection with a description
    [[__many__]]
    description = string
    label = string(default="")

[meta-zones]
# Each zone is a subsection with a description
    [[__many__]]
    description = string
    label = string(default="")

[hydro-features]
# Principales caracteristiques hydrographiques par zone
# (upwelling, panache, ondes internes, front d'Ouessant, ...)
    [[__many__]] # zone
    label = string(default="")
        [[[__many__]]] # caracteristique (ex: Ondes internes, Front d'Ouessant, Panache, Upwelling)
        label = string(default="")
        description = string(default="")

[images]
# Images organized by comparison type, output type and metazone
    [[__many__]] #type
    label = string(default="")
        [[[__many__]]] # section
        label = string(default="")
            [[[[__many__]]]] #output
            label = string(default="")
                [[[[[__many__]]]]] #metazone
                label = string(default="")
                path = string_list
