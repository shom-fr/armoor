[data]
    [[__many__]]
    name = string()
    path = path()
    fmt = option(woa18, cmems_insitu, cora_insitu, cmems_sst_l4, cmems_sst_l3, cersat_sst_l3, hycom, croco, cmems_model, eddy_pet, eddy_sacso, eddy_shoot, odar)
    platform = option(argo, drifter, glider, mooring, default=None)
    ref = boolean(default=False)

[outputs]
    fmt=options(netcdf,zarr,png)
    [[__many__]]
    otype=option(diagdisp_glob,diagdisp_sel,timeseries,maps,maps_current,maps_trajectory,mvprofiles,uvprofiles,mdiagts,udiagts,sections)
        [[[vminmax]]]
        __many__ = minmax(default=None)

[hpc]
    queue        = string(default=seq)
    time_load    = string(default=02:00:00)
    time_comp    = string(default=02:00:00)
    time_plot    = string(default=01:00:00)
    time_merge   = string(default=00:05:00)
    ncpus        = integer(default=1)
    ncpus_load   = integer(default=8)
