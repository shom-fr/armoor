[data]
    [[__many__]]
    name = string()
    path = path()
    fmt = option(hycom, croco, croco_xios, cmems_model, eddy_pet, eddy_sacso, eddy_shoot, woa18, bobyclim, cmems_sst_l4, cmems_sst_l3, cersat_sst_l3, arpege_insta)
[outputs]
    fmt=options(netcdf,zarr,png)
    [[__many__]]
    otype=option(timeseries,maps,mvprofiles,uvprofiles,vprofiles_sel,mdiagts,udiagts,diagts_sel,pdf_eddies,mapseries)
    nstd=float(default=2.5)
    vector_style=option(quiver,barbs,default=quiver)
    vector_scale=float(default=1.0)
    rarification=integer(default=None)
    barbs_length=float(default=4.0)
    barbs_linewidth=float(default=0.3)
    quiver_scale=float(default=None)
    clim=string(default=None)
    cbar_group=string(default=None)
        [[[vminmax]]]
        __many__ = minmax(default=None)
