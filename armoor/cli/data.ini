[data]
    [[__many__]]
    name = string()
    path = path()
    fmt = option(woa18, cmems_insitu, cora_insitu, cmems_sst_l4, cmems_sst_l3, cersat_sst_l3, hycom, croco, croco_xios, cmems_model)
    platform = option(argo, drifter, glider, mooring, default=None)
[outputs]
    fmt=options(netcdf,zarr,png)
    [[__many__]]
    otype=option(timeseries,maps,mvprofiles,uvprofiles,mdiagts,udiagts)