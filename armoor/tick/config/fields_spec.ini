title = string(default=None) # Complément de titre
kind = option(field_value, nodata, numeric, default=None) # Type d’anomalie
production_time = string(default=None) # Date de production
comment = string(default=None) # Commentaire
reporter = string(default=None) # Nom de la personne qui rapporte l’anomalie
reporting_level = option(0,100, default=None) # Niveau d’intérêt : Niveau 0 : intérêt pour tous, Niveau 100 : intérêt experts seulement
model = option(hycom3d_med, hycom3d_indien, hycom3d_manga, CROCO, PSY4, TOPAZ, default=None) # Modèle
related = force_list(default=None) # Liste des tickets liés à cette anomalie
version = string(default=None) # Identifiant git si modèle Shom
config = string(default=None) # Nom de la configuration régionale
hpc = string(default=None) # Calculateur
lon = string(default=None) # Extension zonale
lat = string(default=None) # Extension méridienne
depth = string(default=None) # Extension verticale en valeur numérique (en m, en numéro de couche) ou de type « surf », « bottom ».
time = string(default=None) # Extension temporelle
standard_name = string(default=None) # Nom de la variable par son nom standard
src_file = string(default=None) # Fichier1#ligne, fichier2#ligne
delta_clim = string(default=None) # Ecart à une climatologie
clim_value = string(default=None) # Valeur climatologique
clim_name = string(default=None) # Nom de la climatologie
blocking = option(True, False, default=None) # 'True' si anomalie bloquante, 'False' sinon.


