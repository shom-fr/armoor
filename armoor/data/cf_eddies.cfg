[register]
name=eddies

    [[attrs]]
    reference = "Attributes are set taking SHOOT from Nov.2026 as reference"

[data_vars]

    [[i_cen]]
    name=i_cen
        [[[attrs]]]
        long_name="Grid index of the eddy center along x"

    [[j_cen]]
    name=j_cen
        [[[attrs]]]
        long_name="Grid index of the eddy center along y"

    [[x_cen]]
    name=x_cen
        [[[attrs]]]
        long_name="Longitude of the eddy center"
        units=degrees_east

    [[y_cen]]
    name=y_cen
        [[[attrs]]]
        long_name="Latitude of the eddy center"
        units=degrees_north

    [[ro]]
    name=ro
        [[[attrs]]]
        long_name="Rossby number"
        units=1

    [[radius]]
    name=radius
        [[[attrs]]]
        long_name="Radius of the fitted ellipse"
        units=km

    [[length]]
    name=length
        [[[attrs]]]
        long_name="Perimeter of the fitted ellipse"
        units=km

    [[x_ell]]
    name=x_ell
        [[[attrs]]]
        long_name="Longitude of the fitted ellipse center"
        units=degrees_east

    [[y_ell]]
    name=y_ell
        [[[attrs]]]
        long_name="Latitude of the fitted ellipse center"
        units=degrees_north

    [[a_ell]]
    name=a_ell
        [[[attrs]]]
        long_name="Semi-major axis of the fitted ellipse"
        units=km

    [[b_ell]]
    name=b_ell
        [[[attrs]]]
        long_name="Semi-minor axis of the fitted ellipse"
        units=km

    [[angle_ell]]
    name=angle_ell
        [[[attrs]]]
        long_name="Orientation angle of the fitted ellipse"
        units=degrees

    [[eff_radius]]
    name=eff_radius
        [[[attrs]]]
        long_name="Mean radius of the boundary contour"
        units=m

    [[eff_length]]
    name=eff_length
        [[[attrs]]]
        long_name="Length of the boundary contour"
        units=m

    [[vmax_radius]]
    name=vmax_radius
        [[[attrs]]]
        long_name="Mean radius of the maximal speed contour"
        units=m

    [[vmax_length]]
    name=vmax_length
        [[[attrs]]]
        long_name="Length of the maximal speed contour"
        units=m

    [[vmax]]
    name=vmax
        [[[attrs]]]
        long_name="Mean speed along the maximal speed contour"
        units=m s-1

    [[x_eff_contour]]
    name=x_eff_contour
        [[[attrs]]]
        long_name="Longitudes of the boundary contour"
        units=degrees_east

    [[y_eff_contour]]
    name=y_eff_contour
        [[[attrs]]]
        long_name="Latitudes of the boundary contour"
        units=degrees_north

    [[x_vmax_contour]]
    name=x_vmax_contour
        [[[attrs]]]
        long_name="Longitudes of the maximal speed contour"
        units=degrees_east

    [[y_vmax_contour]]
    name=y_vmax_contour
        [[[attrs]]]
        long_name="Latitudes of the maximal speed contour"
        units=degrees_north

[coords]

    [[time]]
    name=time