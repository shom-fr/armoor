[register]
name=croco_xios

    [[attrs]]
    ini_file=*CROCO*
    type=*XIOS*

[sglocator]
name_format={root}_{loc}
valid_locations=rho,w,u,v,r,psi

[accessors]

    [[properties]]
    coords=ptemp

[vertical]
positive=up
type=sigma

[coords]
    
    [[time_centered]]
    name=time_centered
    
    [[time]]
    name=time_counter

    [[x]]
    name=x
    search_order=n
    standard_name=x_grid_index

    [[y]]
    name=y
    search_order=n
    standard_name=y_grid_index

    [[sig]]
    name=s
    add_loc=True

    [[depth]]
    add_loc=True
    
[data_vars]

    [[sal]]
    name=salt

    [[ptemp]]
    name=temp
    
    [[pdens]]
    name=rho

    [[ssh]]
    name=zeta

    [[bathy]]
    name=h

    [[mask]]
    mask=mask
    add_loc=True

    [[corio]]
    name=f

    [[akt]]
    name=AKt
    
    [[akv]]
    name=AKv

    [[ex]]
    name=pm

    [[ey]]
    name=pn

    [[sig]]
    name=s

    [[cs]]
    name=Cs
    add_loc=True

    
