[register]
name=hycom

    [[attrs]]
    nsigma = "[0-9]?"

[sglocator]
name_format="{root}_{loc}"
valid_locations=u,v

[vertical]
positive=down
type=dz

[data_vars]

    [[ptemp]]
    name=temp
    alt_names=sst
 
    [[sal]]
    name=saln

    [[bathy]]
    name=bathymetry
    
    [[dz]]
    name=h
    
    [[ssh]]
    name=ssh

[coords]

    [[x]]
    name=X
        [[[attrs]]]
        axis=X

    [[y]]
    name=Y
        [[[attrs]]]
        axis=Y

    [[z]]
    name=lev
        [[[attrs]]]
        axis=Z
