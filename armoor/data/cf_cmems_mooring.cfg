[register]
name=cmems_mooring
    [[attrs]]
    DATA_ID=CMEMS_MOORING
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[temp]]
    name=TEMP
    [[temp_qc]]
    name=TEMP_QC
    [[sal]]
    name=PSAL
    [[sal_qc]]
    name=PSAL_QC
    [[depth]]
    name=DEPH
    [[depth_qc]]
    name=DEPH_QC
    [[cdir]]
    alt_names=HCDT
    [[cspeed]]
    alt_names=HCSP
    
[coords]
    [[lat_precise]]
    name=PRECISE_LATITUDE
    [[lon_precise]]
    name=PRECISE_LONGITUDE
    [[lon]]
    name=LONGITUDE
        [[[attrs]]]
        axis=X
    [[lat]]
    name=LATITUDE
        [[[attrs]]]
        axis=Y
    [[level]]
    name=N_LEVELS
        [[[attrs]]]
        axis=Z
    [[time]]
    name=TIME
        [[[attrs]]]
        axis=T

    