[register]
name=croco

    [[attrs]]
    ini_file=*CROCO*
    type=*ROMS*

[sglocator]
name_format={root}_{loc}
valid_locations=rho,w,u,v,r,psi

[accessors]

    [[properties]]
    coords=ptemp

[vertical]
positive=up
type=sigma

[coords]

    [[scrum_time]]
    alt_names=scrum_time
    search_order=n

    [[time]]
    alt_names=time
    search_order=n
    
    [[x]]
    alt_names=xi,x
    search_order=n
    standard_name=x_grid_index

    [[y]]
    alt_names=eta,y
    search_order=n
    standard_name=y_grid_index

    [[sig_w]]
    name=s_w
    alt_names=sc_w,s_w,sig_w
    add_loc=True
    
    [[sig_rho]]
    name=s_rho
    alt_names=sc_rho,s_rho,sig_rho
    add_loc=True   
    
    #[[depth]]
    #add_loc=True
    
[data_vars]

    [[sal]]
    name=salt

    [[ptemp]]
    name=temp
    
    [[pdens]]
    name=rho

    [[ssh]]
    name=zeta

    [[bathy]]
    name=h

    [[mask]]
    mask=mask
    add_loc=True

    [[corio]]
    name=f

    [[akt]]
    name=AKt
    
    [[akv]]
    name=AKv

    [[ex]]
    name=pm

    [[ey]]
    name=pn

    [[sig]]
    alt_names=s,sig,sc

    [[cs]]
    name=Cs
    add_loc=True

    
