[register]
name=croco

    [[attrs]]
    ini_file=*CROCO*
    type=*ROMS*

[sglocator]
name_format={root}_{loc}
valid_locations=rho,w,u,v,r,psi

[accessors]

    [[properties]]
    coords=ptemp

[vertical]
positive=up
type=sigma

[coords]
    
    [[time]]
    name=time_centered

    [[time_counter]]
    name=time_counter

    [[x]]
    name=xi
    search_order=n
    standard_name=x_grid_index

    [[y]]
    name=eta
    search_order=n
    standard_name=y_grid_index
    
    [[nav_lon]]
    name=nav_lon
    search_order=n
    
    [[nav_lat]]
    name=nav_lat
    search_order=n

    [[sig]]
    name=s
    add_loc=True

    [[depth]]
    add_loc=True
    
[data_vars]

    [[sal]]
    name=salt

    [[ptemp]]
    name=temp
    
    [[pdens]]
    name=rho

    [[ssh]]
    name=zeta

    [[bathy]]
    name=h

    [[mask]]
    mask=mask
    add_loc=True

    [[corio]]
    name=f

    [[akt]]
    name=AKt
    
    [[akv]]
    name=AKv

    [[ex]]
    name=pm

    [[ey]]
    name=pn

    [[sig]]
    name=s

    [[cs]]
    name=Cs
    add_loc=True

    
