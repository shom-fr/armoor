[register]
name=croco

    [[attrs]]
    ini_file=*CROCO*
    type=*ROMS*

[sglocator]
name_format={root}_{loc}
valid_locations=rho,w,u,v,r,psi

[accessors]

    [[properties]]
    coords=ptemp

[vertical]
positive=up
type=sigma

[data_vars]

    [[sal]]
    name=salt

    [[ptemp]]
    name=temp

    [[ssh]]
    name=zeta

    [[bathy]]
    name=h

    [[mask]]
    mask=mask
    add_loc=True

    [[corio]]
    name=f

    [[akt]]
    name=AKt

    [[ex]]
    name=pm

    [[ey]]
    name=pn

    [[cs]]
    name=Cs
    add_loc=True

    [[sig]]
    name=s

[coords]

    [[lat]]
    add_loc=True
    
    [[lon]]
    add_loc=True

    [[y]]
    alt_names=eta,y
    search_order=n
    standard_name=y_grid_index
    add_loc=True
    
    [[x]]
    alt_names=xi,x
    search_order=n
    standard_name=x_grid_index
    add_loc=True
    
    [[sig]]
    name=s
    add_loc=True

    [[depth]]
    add_loc=True