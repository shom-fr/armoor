[register]
name=cmems_model

[coords]
    [[lon]]
    name=longitude
        [[[attrs]]]
        axis=X
    [[lat]]
    name=latitude
        [[[attrs]]]
        axis=Y

[data_vars]

    [[mld]]
    name=mixed_layer_depth
    alt_names=mld,mixed_layer_depth,mlotst
    [[bathy]]
    alt_names=deptho,bathymetry
    [[u]]
    alt_names=uo,u
    [[v]]
    alt_names=vo,v
    [[ssh]]
    alt_names=zos,ssh
    [[ptemp]]
    alt_names=thetao,temperature
    [[sal]]
    alt_names=so,salinity
