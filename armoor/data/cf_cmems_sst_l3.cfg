[register]
name=cmems_sst_l3
    [[attrs]]
    DATA_ID=SST_L3
[sglocator]
name_format=False

[coords]
    [[or_lon]]
    name=or_longitude
    [[or_lat]]
    name=or_latitude
    [[lon]]
    alt_names=lon,longitude
        [[[attrs]]]
        axis=X
    [[lat]]
    alt_names=lat,latitude
        [[[attrs]]]
        axis=Y
    [[time]]
    name=time
        [[[attrs]]]
        axis=T
[data_vars]
    [[ptemp_qc]]
    name=quality_level
    [[ptemp]]
    name=sea_surface_temperature
        [[[attrs]]]
        units=kelvin
