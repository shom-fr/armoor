[register]
name=cmems_drifter
    [[attrs]]
    DATA_ID=CMEMS_DRIFTER
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL
    
[coords]
    [[lon]]
    name=LONGITUDE
        [[[attrs]]]
        axis=X
    [[lat]]
    name=LATITUDE
        [[[attrs]]]
        axis=Y
    [[level]]
    name=N_LEVELS
        [[[attrs]]]
        axis=Z
    [[time]]
    name=TIME
        [[[attrs]]]
        axis=T
    [[depth]]
    name=DEPH
        [[[attrs]]]
        axis=Z
    

