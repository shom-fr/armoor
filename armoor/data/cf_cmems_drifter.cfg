[register]
name=cmems_drifter
    [[attrs]]
    DATA_ID=CMEMS_DRIFTER
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL

[coords]
    [[lon]]
    name=LONGITUDE
    search_order=snu
        [[[attrs]]]
        axis=X
        standard_name=longitude
        units=degrees_east
    [[lat]]
    name=LATITUDE
    search_order=snu
        [[[attrs]]]
        axis=Y
        standard_name=latitude
        units=degrees_north
    [[level]]
    name=N_LEVELS
        [[[attrs]]]
        axis=Z
    [[time]]
    name=TIME
        [[[attrs]]]
        axis=T
    [[depth]]
    name=DEPH
        [[[attrs]]]
        axis=Z
