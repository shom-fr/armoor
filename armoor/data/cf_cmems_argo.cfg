[register]
name=cmems_argo
    [[attrs]]
    DATA_ID=CMEMS_ARGO
#[sglocator]
#name_format=False
#[vertical] # Vertical coordinate system
#positive=down
#type=z
[coords]
    [[lon]]
    name=LONGITUDE
        [[[attrs]]]
        axis=X
    [[lat]]
    name=LATITUDE
        [[[attrs]]]
        axis=Y
    [[level]]
    name=N_LEVELS
        [[[attrs]]]
        axis=Z
    [[time]]
    name=TIME
        [[[attrs]]]
        axis=T
    [[pres]]
    alt_names=PRES_ADJUSTED,PRES
        [[[attrs]]]
        axis=Z
[data_vars]
    [[temp]]
    alt_names=TEMP_ADJUSTED,TEMP
    [[sal]]
    alt_names=PSAL_ADJUSTED,PSAL
    [[temp_qc]]
    alt_names=TEMP_ADJUSTED_QC,TEMP_QC
    [[sal_qc]]
    alt_names=PSAL_ADJUSTED_QC,PSAL_QC
    [[pres_qc]]
    alt_names=PRES_ADJUSTED_QC,PRES_QC
    
