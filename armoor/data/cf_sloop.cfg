[register]
name=sloop

[vertical]
positive=down
type=z

[coords]
    [[lon]]
    name=lon
        [[[attrs]]]
        axis=X

    [[lat]]
    name=lat
        [[[attrs]]]
        axis=Y

[data_vars]

    [[ptemp]]
    name=temperature
    alt_names=temperature,ptemp

    [[sal]]
    name=salinity
    alt_names=salinity,sal

    [[u]]
    name=u
    alt_names=u

    [[v]]
    name=v
    alt_names=v

    [[ssh]]
    name=ssh
    alt_names=ssh
