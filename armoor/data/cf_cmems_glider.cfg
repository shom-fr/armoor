[register]
name=cmems_glider
    [[attrs]]
    DATA_ID=CMEMS_GLIDER
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[data_vars]
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL
    [[temp_qc]]
    alt_names=TEMP_QC
    [[sal_qc]]
    alt_names=PSAL_QC
    [[pres_qc]]
    alt_names=PRES_QC
    [[depth_qc]]
    name=DEPH_QC
    
[coords]
    [[lon]]
    name=LONGITUDE
        [[[attrs]]]
        axis=X
    [[lat]]
    name=LATITUDE
        [[[attrs]]]
        axis=Y
    [[time]]
    name=TIME
        [[[attrs]]]
        axis=T
    [[depth]]
    alt_names=DEPH,DEPTH
        [[[attrs]]]
        axis=Z
    [[pres]]
    name=PRES
        [[[attrs]]]
        axis=Z

