[register]
name=cora_argo
    [[attrs]]
    DATA_ID=CORA_ARGO
[sglocator]
name_format=False
[vertical] # Vertical coordinate system
positive=down
type=z
[coords]
    [[lon]]
    name=LONGITUDE
    search_order=snu
        [[[attrs]]]
        axis=X
        standard_name=longitude
        units=degrees_east
    [[lat]]
    name=LATITUDE
    search_order=snu
        [[[attrs]]]
        axis=Y
        standard_name=latitude
        units=degrees_north
    [[level]]
    name=N_LEVELS
        [[[attrs]]]
        axis=Z
    [[time]]
    name=JULD
        [[[attrs]]]
        axis=T
    [[pres]]
    name=PRES
        [[[attrs]]]
        axis=Z
[data_vars]
    [[temp_qc]]
    name=TEMP_QC
    [[sal_qc]]
    name=PSAL_QC
    [[pres_qc]]
    name=PRES_QC
    [[temp]]
    name=TEMP
    [[sal]]
    name=PSAL