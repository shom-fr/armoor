functionality = prof_hydro_vessel
output_path = {tmpdir}/prof_hydro_vessel/cmems_vs_HyCOM_layers_intervals/
[observation]
    name = cmems_argo
    path = {sample_dir}/GL_PR_PF_*.nc
    fmt = cmems_insitu
    platform = argo
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test_layers_intervals
    tbound= 2023-04-25, 2024-06-04
    trange_seq = 1d
    vrange = {"depth": [[50, 100], [200, 300]]}
    vref = model
    radius = 10000
[outputs]
    [[maps_biais]]
        plot = plot_map_metr_biais
      	colormap = thermal
    [[maps_rmse]]
        plot = plot_map_metr_RMSE
        colormap = thermal
    [[maps_rmsec]]
        plot = plot_map_metr_RMSEc
        colormap = thermal
    [[global_dispersion_diagram]]
        plot = diag_disp_g
    [[dispersion_diagrams]]
        plot = diag_disp
    [[time_series]]
        plot = plot_ts_metr_stats
    
