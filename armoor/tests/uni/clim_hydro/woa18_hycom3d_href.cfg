functionality = clim_hydro
output_path = {tmpdir}/clim_hydro/woa18_vs_HyCOM_href/
[observation]
    name = woa18
    path = {sample_dir}/woa18_*.nc
    fmt = woa18
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound= 2020-04-23, 2026-08-18
    trange_clim = "month"
    href = obs
    vlevel = {"depth": [10.0, 100.0]}
[outputs]
    [[time_series_stats]]
        plot = plot_ts_metr_stats
    [[maps_ecart]]
        plot = plot_map_metr_ecart
