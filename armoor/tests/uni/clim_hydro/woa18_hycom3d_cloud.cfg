functionality = clim_hydro
output_path = {tmpdir}/clim_hydro/woa18_vs_HyCOM_cloud/
[observation]
    name = woa18
    path = {sample_dir}/woa18_*.nc
    fmt = woa18
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound= 2020-04-23, 2026-08-18
    trange_clim = "month"
    coord = [12.5, 49.0], [12.4, 49.5]
    vlevel = {"depth": [10.0, 100.0]}
[outputs]
    [[time_series_cloud]]
        plot = plot_ts_metr_cloud
    [[maps_ecart]]
        plot = plot_map_metr_ecart
