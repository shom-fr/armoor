functionality = prof_hydro_vessel
output_path = {tmpdir}/prof_hydro_vessel/cmems_vs_HyCOM/
[observation]
    name = cmems_argo
    path = {sample_dir}/GL_PR_PF_*.nc
    fmt = cmems_insitu
    platform = argo
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound= 2023-04-25, 2024-06-04
    vars = temp, sound_speed
    radius = 10000
[outputs]
    [[profils]]
        plot = plot_profile_u
    [[theta_sal_diagram]]
        plot = diag_ts_unique