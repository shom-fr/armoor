functionality = sst
output_path = {tmpdir}/sst/L4_vs_HyCOM_cloud_intervals/
[observation]
    name = sst_L4
    path = {sample_dir}/*L4*.nc
    fmt = cmems_sst_l4
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound= 2021-04-25, 2024-07-27
    trange_seq = 50D
    tref = obs
    coord = [41.4, 9.5], [40.8, 8.75]
[outputs]
    [[time_series_stats]]
        plot = plot_ts_metr_stats
    [[time_series_cloud]]
        plot = plot_ts_metr_cloud
    [[dispersion_diag_global]]
        plot = diag_disp_g
    [[dispersion_diag]]
        plot = diag_disp
    [[maps_biais]]
        plot = plot_map_metr_biais
    [[maps_rmse]]
        plot = plot_map_metr_RMSE
    [[maps_rmsec]]
        plot = plot_map_metr_RMSEc
