functionality = sst
output_path = {tmpdir}/sst/L4_vs_HyCOM_href_intervals/
[observation]
    name = sst_L4
    path = {sample_dir}/*L4*.nc
    fmt = cmems_sst_l4
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound= 2021-04-25, 2024-07-27
    trange_seq = 50D
    tref = obs
    href = obs
[outputs]
    [[dispersion_diag_global]]
       plot = diag_disp_g
    [[dispersion_diag]]
        plot = diag_disp
    [[time_series]]
        plot = plot_ts_metr_stats
    [[maps_biais]]
        plot = plot_map_metr_biais
    [[maps_rmse]]
        plot = plot_map_metr_RMSE
    [[maps_rmsec]]
        plot = plot_map_metr_RMSEc