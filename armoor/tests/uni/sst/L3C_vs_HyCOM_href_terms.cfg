functionality = sst
output_path = {tmpdir}/sst/L4_vs_HyCOM_href_terms/
[observation]
    name = sst_L4
    path = {sample_dir}/*L3C*SEVIRI*.nc
    fmt = cersat_sst_l3
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound= 2021-04-25, 2024-07-27
    tfreq = 300D
    href = obs
[outputs]
    [[dispersion_diag_global]]
        plot = diag_disp_g
    [[dispersion_diag]]
        plot = diag_disp
    [[time_series]]
        plot = plot_ts_metr_stats
    [[maps]]
        plot = plot_map_metr_ecart
