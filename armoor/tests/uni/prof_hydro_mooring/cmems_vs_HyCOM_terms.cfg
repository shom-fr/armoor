functionality = prof_hydro_mooring
output_path = {tmpdir}/prof_hydro_mooring/cmems_vs_HyCOM_terms/
[observation]
    name = cmems_argo
    path = {sample_dir}/*_TS_MO_*.nc
    fmt = cmems_insitu
    platform = mooring
[models]
    [[hycom]]
        name = HyCOM
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
    [[hycom2]]
        name = HyCOM2
        path = {sample_dir}/hycom_*.nc
        fmt = hycom
[metazone]
    name = test
    tbound = 2023-03-25, 2024-12-04
    tfreq = 1d
    vars = temp, sound_speed
    radius = 10000
[outputs]
    [[time_series]]
        plot = plot_ts_metr_stats