functionality = currents_ADCP
colocate = observation
output_path = ./
[observation]
    name = ADCP-FROMVEUR
    path = ../data/test_f7/OBS/F1204_FROMVEUR_NORD-EST_375.txt
    method = nearest
    type = mouillage

[models]
    [[NEMO]]
        name = HYCOM3D
        path = ../data/test_f7/MODEL/HYCOM/2013/h_3D_Fromveur_201309_201310.nc, ../data/test_f7/MODEL/HYCOM/2013/u_3D_Fromveur_201309_201310.nc, ../data/test_f7/MODEL/HYCOM/2013/v_3D_Fromveur_201309_201310.nc
        method = linear
        type = HYCOM_currents

[meta_zone]
    name = meta-zone 3
    bathy_min = 50
    radius = 20

[outputs]
    [[plot_hovmoller_ADCP_bathyradius]]
        plot = plot_hovmoller
	    attribute = current





