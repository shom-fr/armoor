functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[meta_zone]
    vars = temp
    #depth = 0, 100
    radius = 5
    interval = 12H
[observation]
    name = TEMP
    path = ../data/test_f2/OBS/argo-profiles-6901193.nc, ../data/test_f2/OBS/argo-profiles-3901909.nc, ../data/test_f2/OBS/argo-profiles-3901943.nc
    method = nearest
    type = CORA
[models]
    [[cmems]]
        name = cmems
        path = ../data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083deg_P1D-m_1718632989261.nc
        method = nearest
        method_z = nearest
[outputs]
    [[plot_diag_disp_multi_list_cora]]
        plot = diag_disp_g
        attribute = temp, sal


