functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[observation]
    name     = cmems-profiling-floats
    path     = ../data/test_VA_2/GL_PR_PF_6903133_202304.nc
    method   = linear
    type     = CMEMS
    
[models]
    [[daily_0day_forecast]]
        name   = sloop-hycom3d-medoc-daily_0day_forecast
        path   = ../data/test_VA_2/hycom3d_model_output.3d-hycom3d-h-none.medoc.netcdf,../data/test_VA_2/hycom3d_model_output.3d-hycom3d-saln-none.medoc.netcdf,../data/test_VA_2/hycom3d_model_output.3d-hycom3d-temp-none.medoc.netcdf,
        method = linear
        method_z = linear
        type = HYCOM_3D

[meta_zone]
    name    = medoc
    start   = 2023-04-08T00:00:00
    end     = 2023-04-13T00:00:00
    radius  = 2
    polygon = [3.5, 39.5], [3.5, 44.5], [8.5, 44.5], [8.5, 39.5]

[outputs]
    [[plot_diag_ts_unique_ticket146]]
        plot = diag_ts_unique
        attribute = temp, sal
