functionality = prof_hydro_vessel
colocate = observation
output_path = ./
[observation]
    name = Profilers
    path = ../data/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type=CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method_z = linear

[meta_zone]
    name = meta-zone 6
    start = 2001-03-01T00:00:00
    end = 2001-12-31T00:00:00
    interval = 2000h
    vars = temp
    min_depth= 0
    max_depth =170
    slice=[[0,30], [30,60],[60,100], [100,170]]

[outputs]
    [[plot_multi_plot_tranche_intervalle_diag_disp]]
        plot = diag_disp
        colormap = thermal
        attribute = temp
    [[plot_multi_plot_tranche_intervalle_map_metr_biais]]
        plot = plot_map_metr_biais
	    colormap = solar
        attribute = temp
    [[plot_multi_plot_tranche_intervalle_map_metr_RMSE]]
        plot = plot_map_metr_RMSE
	    colormap = solar
        attribute = temp
    [[plot_multi_plot_tranche_intervalle_map_metr_RMSEc]]
        plot = plot_map_metr_RMSEc
	    colormap = solar
        attribute = temp



