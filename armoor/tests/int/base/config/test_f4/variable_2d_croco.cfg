functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = radiale glider
    path = ../data/test_f4/OBS/GL_PR_GL_64556_for_croco.nc
    method = nearest
    method_z = nearest
    type = CMEMS

[models]
    [[NEMO]]
        name = CROCO
        path = ../data/test_f1/MODEL/CROCO_loire.nc
	    type = CROCO
        method = nearest
        method_z = nearest

[meta_zone]
    name = meta-zone 2
    vars = mld
    start = 2015-01-01T00:00:00.000000000
    end = 2015-01-03T00:00:00.000000000

[outputs]
    [[plot_variable_2d_croco]]
        plot = plot_variable_2d
        attribute = mld_ptemp
