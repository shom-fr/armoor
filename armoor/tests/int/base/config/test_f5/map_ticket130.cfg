functionality = clim_hydro
colocate = model
output_path = ./

[observation]
    name = Clim_WOA18
    path = ../data/test_VA_2/woa18_decav_s04_04.nc,../data/test_VA_2/woa18_decav_t04_04.nc,
    method = linear
    type = WOA18

[models]
    [[daily_0day_forecast]]
        name = daily_forecast
        path   = ../data/test_VA_2/hycom3d_model_output.3d-hycom3d-h-none.medoc.netcdf,../data/test_VA_2/hycom3d_model_output.3d-hycom3d-saln-none.medoc.netcdf,../data/test_VA_2/hycom3d_model_output.3d-hycom3d-temp-none.medoc.netcdf,
        method = linear
        method_z = linear
    	    type = HYCOM_3D

[meta_zone]
    name = medoc
    polygon = [3.5, 39.5], [3.5, 44.5], [8.5, 44.5], [8.5, 39.5]
    depth = 5, 500, 1000

[outputs]
    [[plot_map_ticket130]]
        plot = plot_map_metr_ecart 
