functionality = clim_hydro
colocate = model
output_path = ./
[observation]
    name = Clim_WOA18
    path = ../data/test_f5/climato/mensuel/woa18_decav_s01_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s02_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s03_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s04_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s05_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s06_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s07_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s08_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s09_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s10_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s11_5d.nc,../data/test_f5/climato/mensuel/woa18_decav_s12_5d.nc
    method = nearest
    type = WOA18

[models]
    [[NEMO]]
        name = Reanalysis
        path = ../data/test_f5/climato/global-reanalysis-phy.nc
        method = nearest

[meta_zone]
    name = meta-zone 1
    polygon = [-35,8], [-35, 55],[46, 55], [46, 8]
    depth = 5

[outputs]
    [[plot_map_diff]]
        plot = plot_map_metr_ecart 
        attribute = sal










