functionality = prof_hydro_mooring
colocate = observation
output_path = ./
[observation]
    name = Mooring
    path = ../data/test_f3/OBS/IR_TS_MO_Donostia-buoy_202304.nc
    method = nearest
    method_z = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f3/MODEL/cmems_mod_ibi_phy_anfc_0.027deg-3D_PT1H-m_1713886029501.nc
        method = nearest
        method_z = nearest

[meta_zone]
    name = meta-zone 1
    start = 2023-04-20T00:00:00
    end = 2023-04-30T00:00:00
    radius = 2
    interval = 24 h
    vars = temp, sound_speed
    #depth = 200

[outputs]
    [[plot_ser_temp_stat]]
        plot = plot_ts_metr_f3
        attribute = temp, sound_speed
