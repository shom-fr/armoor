functionality = currents_VMADCP
vertical_step = 10
horizontal_step = 5
colocate = observation
output_path = ./
[observation]
    name = VM-ADCP
    path = ../data/test_f8/OBS/OS_150_STA_098_for_hycom.txt
    method = linear
    type = VMADCP

[models]
    [[HYCOM]]
        name = HYCOM
        path = ../data/test_f8/MOD/h_3D_med.nc, ../data/test_f8/MOD/u_3D_med.nc, ../data/test_f8/MOD/v_3D_med.nc
        method = linear
        type = HYCOM_currents

[meta_zone]
    name = meta-zone 2
    depth = 20

[outputs]
    [[plot_stick_plot_vmadcp_hycom_1depth]]
        plot = plot_stick_plot











