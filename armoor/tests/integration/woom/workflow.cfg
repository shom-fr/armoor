[app]
name=TESTS_INTEGRATIONS_ARMOOR

[params]
rundate=today
lon_min=-8.0
lon_max=-1.5
lat_min=42
lat_max=45

[stages]

    [[prolog]]
    copernicus_login=copernicus_login
    get_data=get_cmems_insitu,get_cmems_sst_l4,get_cmems_sst_l3,get_cmems_glo12_bathy,get_cmems_glo12_curr,get_cmems_glo12_sal,get_cmems_glo12_temp
    comp=comp_sst,comp_argo,comp_mooring,comp_drifter
    bull=make_bull
    interp_time=interp_time
    filters_oceanvars=filters_oceanvars
    filters_polygon=filters_polygon
    interp_horizontal_lonlatgrid=interp_lonlatgrid
    interp_horizontal_cloud=interp_cloud
    interp_horizontal_section=interp_section
    interp_vertical_cloud=interp_vfreq_cloud,interp_vlevel_cloud
    interp_vertical_section=interp_vfreq_section,interp_vlevel_section
    interp_vertical_lonlatgrid=interp_vfreq_lonlatgrid,interp_vlevel_lonlatgrid
    filters_tresample=filters_tresample
    filters_tides=filters_tides
    filters_tsmooth=filters_tsmooth
    filters_daterange=filters_daterange
    filters_bathy=filters_bathy
    