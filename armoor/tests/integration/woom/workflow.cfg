[app]
name=TESTS_INTEGRATIONS_ARMOOR

[params]
rundate=today
lon_min=-8.0
lon_max=-3.0
lat_min=43
lat_max=47
comp_sst="comp_sst.cfg"
metazones="metazones.cfg"

[stages]

    [[prolog]]
    copernicus_login=copernicus_login
    get_data=get_cmems_sst_l4,get_cmems_sst_l3,get_cmems_glo12_bathy,get_cmems_glo12_curr,get_cmems_glo12_sal,get_cmems_glo12_temp
    comp=comp_sst
    interp_time=interp_time
    filters_oceanvars=filters_oceanvars
    filters_polygon=filters_polygon
    interp_horizontal=interp_cloud,interp_section,interp_lonlatgrid
    interp_vertical=interp_vfreq_cloud,interp_vfreq_section,interp_vfreq_lonlatgrid,interp_vlevel_cloud,interp_vlevel_section,interp_vlevel_lonlatgrid
    filters_tresample=filters_tresample
    filters_tides=filters_tides
    filters_tsmooth=filters_tsmooth
    filters_daterange=filters_daterange
    filters_bathy=filters_bathy
    