[sl-hycom-prod]
patterns=sl-hycom-prod*
module_setup=. /etc/profile.d/modules.sh
     [[dirs]]
     scratch=/data3/Public/armoor_tests
     run_dir={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             [[[[modules]]]]
             use=/data3/Public/Modulefiles/conda3
             load=armoor-py3.11
            
[local]
     [[dirs]]
     scratch=$HOME/TESTS_INTEGRATIONS_ARMOOR
     run={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             raw_text="""source /opt/conda/etc/profile.d/conda.sh; \
             conda activate $HOME/armoor/armoor_env
             """
         [[[[vars]]]]
                [[[[[append]]]]]
                PYTHONPATH=$PWD
             

