[sl-hycom-prod]
patterns=sl-hycom-prod*
module_setup=. /etc/profile.d/modules.sh
     
     [[dirs]]
     scratch=/data3/mmorvan/
     
     [[envs]]
         [[[armoor]]]
             [[[[modules]]]]
             use=/data3/Public/Modulefiles/conda3
             load=armoor-py3.11
            
[local]
     [[envs]]
         [[[armoor]]]
             raw_text="""source /opt/conda/etc/profile.d/conda.sh; \
             conda activate $HOME/armoor/armoor_env
             """
         [[[[vars]]]]
                [[[[set]]]]
                COPERNICUSMARINE_SERVICE_USERNAME=$COPERNICUSMARINE_SERVICE_USERNAME
                COPERNICUSMARINE_SERVICE_PASSWORD=$COPERNICUSMARINE_SERVICE_PASSWORD
                [[[[[append]]]]]
                PYTHONPATH=$PWD
             

