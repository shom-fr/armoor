[sl-hycom-prod]
patterns=sl-hycom-prod*
module_setup=. /etc/profile.d/modules.sh
     
     [[dirs]]
     scratch=/data3/mmorvan/
     
     [[envs]]
         [[[armoor]]]
             [[[[modules]]]]
             use=/data3/Public/Modulefiles/conda3
             load=armoor-py3.11
            
[local]
     [[envs]]
         [[[armoor]]]
             conda_activate="""echo $PWD; source /opt/conda/etc/profile.d/conda.sh; \
             source activate $HOME/armoor/armoor_env
             """
         [[[[vars]]]]
                [[[[[append]]]]]
                PYTHONPATH=$PWD
             

