[interp_time]
    [[content]]
    commandline="""armoor-interp-time \
    "{{ workflow.get_artifact('output', 'get_cmems_glo12_temp') }},{{ workflow.get_artifact('output', 'get_cmems_glo12_sal') }},{{ workflow.get_artifact('output', 'get_cmems_glo12_curr') }}" \
    {{ task.artifacts['output'] }} 30min --ifmt cmems_model --ofmt netcdf
    """
    env=armoor
    run_dir=~/TESTS_INTEGRATIONS_ARMOOR
    [[artifacts]]
    output={{ run_dir }}/interp_time.nc

[filters_oceanvars]
    [[content]]
    commandline="""armoor-filters-oceanvars \
    "{{ workflow.get_artifact('output', 'interp_time') }}" \
    {{ task.artifacts['output'] }} ptemp sal --ifmt armoor --ofmt netcdf
    """
    env=armoor
