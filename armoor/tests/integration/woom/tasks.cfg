[get_cmems_insitu]
    [[content]]
    commandline="""copernicusmarine get \
    -i cmems_obs-ins_glo_phybgcwav_mynrt_na_irr --index-parts -nd;
    awk -F',' -v minlat={{ params.lat_min }}  -v maxlat={{ params.lat_max }}  -v minlon={{ params.lon_min }}  -v maxlon={{ params.lon_max }}  \
    -v start="{{ (params.rundate|woomdate).add('-5d').strftime('%Y-%m-%dT00:00:00') }}" -v end="{{ (params.rundate|woomdate).strftime('%Y-%m-%dT00:00:00') }}" '
NR<=6 {next}
NR==7 || /^#/ {print; next}
{
    lat=($3+$4)/2; lon=($5+$6)/2
    gsub(/-/,"",start); gsub(/-/,"",end)
    d1=$7; d2=$8; gsub(/T.*/,"",d1); gsub(/T.*/,"",d2)
    gsub(/-/,"",d1); gsub(/-/,"",d2)
    if(lat>=minlat && lat<=maxlat && lon>=minlon && lon<=maxlon && d1<=end && d2>=start) print
}' index_latest.txt | cut -d ',' -f 2 | rev | cut -d '/' -f 1,2 | rev | sed 's/^/latest\//' > filtered_index.txt;
copernicusmarine get --dataset-id cmems_obs-ins_glo_phybgcwav_mynrt_na_irr --file-list filtered_index.txt -nd -o {{ scratch_dir }}
    """
    env=armoor
    
[comp_sst]
    [[content]]
    commandline="""
    ln -sf {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_temp')[0] }};\
    ln -sf {{ workflow.get_task_artifact_paths('output', 'get_cmems_sst_l3')[0] }};\
    ln -sf {{ workflow.get_task_artifact_paths('output', 'get_cmems_sst_l4')[0] }};\
    armoor-comp-sst meta1,meta2 \
    $WOOM_WORKFLOW_DIR/comp_sst.cfg -m $WOOM_WORKFLOW_DIR/metazones.cfg \
    --tbound {{ (params.rundate|woomdate).add('-5d').strftime('%Y-%m-%dT00:00:00') }} \
    {{ (params.rundate|woomdate).strftime('%Y-%m-%dT00:00:00') }}
    """
   env=armoor

[comp_argo]
    [[content]]
    commandline="""
    ln -sf {{ scratch_dir }}/*_PR_PF*.nc .;\
    ln -sf {{ scratch_dir }}/cmems_glo12_*.nc .;\
    armoor-comp-argo meta1,meta2 \
    $WOOM_WORKFLOW_DIR/comp_argo.cfg 20.0 -m $WOOM_WORKFLOW_DIR/metazones.cfg \
    --tbound {{ (params.rundate|woomdate).add('-5d').strftime('%Y-%m-%dT00:00:00') }} \
    {{ (params.rundate|woomdate).strftime('%Y-%m-%dT00:00:00') }}
    """
   env=armoor


[interp_time]
    [[content]]
    commandline="""armoor-interp-time \
    "{{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_temp')[0] }},{{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_sal')[0] }},{{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_curr')[0] }}" \
    {{ task.artifacts['output'][0] }} 30min --ifmt cmems_model --ofmt netcdf; \
    rm  {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_temp')[0] }}; \
    rm  {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_sal')[0] }}; \
    rm  {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_curr')[0] }}; \
    """
