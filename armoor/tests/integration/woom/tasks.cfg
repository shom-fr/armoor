[get_cmems_insitu]
    [[content]]
    commandline="""copernicusmarine get \
    -i cmems_obs-ins_glo_phybgcwav_mynrt_na_irr --index-parts -nd;
    awk -F',' -v minlat={{ params.lat_min }}  -v maxlat={{ params.lat_max }}  -v minlon={{ params.lon_min }}  -v maxlon={{ params.lon_max }}  \
    -v start="{{ (params.rundate|woomdate).add('-5d').strftime('%Y-%m-%dT00:00:00') }}" -v end="{{ (params.rundate|woomdate).strftime('%Y-%m-%dT00:00:00') }}" '
NR<=6 {next}
NR==7 || /^#/ {print; next}
{
    lat=($3+$4)/2; lon=($5+$6)/2
    gsub(/-/,"",start); gsub(/-/,"",end)
    d1=$7; d2=$8; gsub(/T.*/,"",d1); gsub(/T.*/,"",d2)
    gsub(/-/,"",d1); gsub(/-/,"",d2)
    if(lat>=minlat && lat<=maxlat && lon>=minlon && lon<=maxlon && d1<=end && d2>=start) print
}' index_latest.txt | cut -d ',' -f 2 | rev | cut -d '/' -f 1,2 | rev | sed 's/^/latest\//' > filtered_index.txt;
copernicusmarine get --dataset-id cmems_obs-ins_glo_phybgcwav_mynrt_na_irr --file-list filtered_index.txt -nd -o {{ scratch_dir }};
touch {{ task.artifacts['output'] }}
    """
    env=armoor
    [[artifacts]]
        [[[output]]]
            path={{ scratch_dir }}/cmems_insitu.done

