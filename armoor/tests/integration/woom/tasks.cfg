[comp_clim]
    [[content]]
    commandline="""
    ln -sf {{ workflow.get_task_artifact_paths('temp', 'get_woa18') }} . ;
    ln -sf {{ workflow.get_task_artifact_paths('sal', 'get_woa18') }} . ;
    ln -sf {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_temp') }} . ;
    ln -sf {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_sal') }} . ;
    armoor-comp-clim meta1 \
        $WOOM_WORKFLOW_DIR/comp_clim.cfg \
        -m $WOOM_WORKFLOW_DIR/metazones.cfg \
        --tbound {{ (params.rundate|woomdate).add('-5d').strftime('%Y-%m-%dT%H:%M:%S') }} \
                 {{ (params.rundate|woomdate).strftime('%Y-%m-%dT%H:%M:%S') }} \
        --dask-nworkers $(( $(nproc) > 1 ? $(nproc) - 1 : 1 ))
    """
    env=armoor
    run_dir={{ scratch_dir }}/comp_clim

[comp_sst]
    [[content]]
    commandline="""
    ln -sf {{ workflow.get_task_artifact_paths('output', 'get_cmems_glo12_temp') }};\
