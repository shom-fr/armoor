[copernicus_login]
    [[content]]
    commandline="""copernicusmarine login \
    --username $COPERNICUSMARINE_SERVICE_USERNAME \
    --password $COPERNICUSMARINE_SERVICE_PASSWORD \
    --force-overwrite
    """
[get_cmems_glo12_curr]
    [[content]]
    commandline="""copernicusmarine subset \
   --dataset-id cmems_mod_glo_phy-cur_anfc_0.083deg_P1D-m \
   --variable uo \
   --variable vo \
   --start-datetime {{ (params.rundate|woomdate).add('-5d').strftime('%Y-%m-%dT%H:%M:%S') }} \
   --end-datetime {{ (params.rundate|woomdate).strftime('%Y-%m-%dT%H:%M:%S') }} \
   --minimum-longitude {{ params.lon_min }} \
   --maximum-longitude {{ params.lon_max }} \
   --minimum-latitude {{ params.lat_min }} \
   --maximum-latitude {{ params.lat_max }} \
   --minimum-depth 0.49402499198913574 \
   --maximum-depth 5000.0 \
   --skip-existing \
   --output-filename {{ task.artifacts['output'][0] }}
   """
   env=armoor
   #scratch_dir={{ scratch_dir }}
   [[artifacts]]
       [[[output]]]
           paths={{ scratch_dir }}/cmems_glo12_curr.nc

