[get_cmems_glo12_bathy]
    [[content]]
    commandline="""copernicusmarine subset \
   --dataset-id cmems_mod_glo_phy_anfc_0.083deg_static \
   --dataset-part bathy \
   --variable deptho \
   --variable deptho_lev \
   --variable mask \
   --minimum-longitude {{ params.lon_min }} \
   --maximum-longitude {{ params.lon_max }} \
   --minimum-latitude {{ params.lat_min }} \
   --maximum-latitude {{ params.lat_max }} \
