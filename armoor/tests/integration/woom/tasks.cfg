[get_woa18]
    [[content]]
    commandline="""
    wget https://www.ncei.noaa.gov/data/oceans/woa/WOA18/DATA/temperature/netcdf/decav/1.00/woa18_decav_t{{ (params.rundate|woomdate).strftime('%m') }}_01.nc ;
    wget https://www.ncei.noaa.gov/data/oceans/woa/WOA18/DATA/salinity/netcdf/decav/1.00/woa18_decav_s{{ (params.rundate|woomdate).strftime('%m') }}_01.nc ;
    mv woa18_decav_*.nc {{ scratch_dir }}/;
    """
    env=armoor
    [[artifacts]]
        [[[temp]]]
            path={{ scratch_dir }}/woa18_decav_t{{ (params.rundate|woomdate).strftime('%m') }}_01.nc
        [[[sal]]]
            path={{ scratch_dir }}/woa18_decav_s{{ (params.rundate|woomdate).strftime('%m') }}_01.nc

