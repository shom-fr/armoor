[get_woa18]
    [[content]]
    commandline="""
    cp $(python3 -c "import os, armoor; print(os.path.dirname(os.path.dirname(armoor.__file__)))")/armoor/_samples/woa18_decav_t{{ (params.rundate|woomdate).strftime('%m') }}_01.nc {{ scratch_dir }}/;
    cp $(python3 -c "import os, armoor; print(os.path.dirname(os.path.dirname(armoor.__file__)))")/armoor/_samples/woa18_decav_s{{ (params.rundate|woomdate).strftime('%m') }}_01.nc {{ scratch_dir }}/;
    """
    env=armoor
    [[artifacts]]
        [[[temp]]]
            path={{ scratch_dir }}/woa18_decav_t{{ (params.rundate|woomdate).strftime('%m') }}_01.nc
