[header]
title = Armoor-test bull
subtitle = pytest/woom execution

[summary]
overview = The objective of this report is to test armoor-bull
key_findings = No comments
model_version = Glo12 from CMEMS
data_sources = From CMEMS: SST L4, SST L3, Argo profiles, Mooring, Gliders, Drifters

[comparison_types]
    [[Sea surface temperature]]
    description = "Sea surface temperature data measured by satellites and modelised by glo12 are compared. \n We will show maps (difference, bias, rms, c.rms), dispersion diagram, time series."
    [[Hydrological profiles]]
    description = "Argo vertical profiles are compared to glo12 by selecting every model points around each argo profile (radius of 20 km). \n We will show vertical profiles, diagrams theta-S."
    [[Hydrological time series]]
    description = "Time series of temperature mesured by moorings are compared to glo12 by selecting every model points around each argo profile (radius of 20 km)."
    [[Lagrangian current and trajectories]]
    description = "Trajectories and current from drifters are compared to glo12. Time series and maps will be shown."

[zones]
    [[meta1]]
    description = "We process data in a polygon defined by 4 points (lat,lon): (45,-14),(49,-14),(49,-10),(45,-10). For sst comparison, the observation grid is used for horizontal regridding and we define instantaneous comparions every 1 day. For argo comparison, vertical depths are defined (in meter): 10, 100, 500, 1000."
    [[meta2]]
    description = "We process data in a polygon defined by 4 points (lat,lon): (45,-14),(49,-14),(49,-10),(45,-10). For sst comparison, the observation grid is used for horizontal regridding and we define a time interval comparions of 1 day. For argo comparison, vertical depth interval are defined (in meter): (10, 1000),(10,100),(100,500),(500,1000)."

