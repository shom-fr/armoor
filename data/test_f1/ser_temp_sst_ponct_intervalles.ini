[observation]
    name = "Obs"
    path = ../../shared_data/models_obs/test_f1/OBS/obs_frommodel_pour_test_colder.nc
    method = nearest
[models]
    [[NEMO]]
        name = NEMO
        path = ../../shared_data/models_obs/test_f1/MODEL/model_pour_test_colder.nc
        method = nearest
    [[NEMO_shifted]]
        name = NEMO_shifted
        path =../../shared_data/models_obs/test_f1/MODEL/model_pour_test_colder3.nc
        method = nearest
