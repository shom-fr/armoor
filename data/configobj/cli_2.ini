functionality = "sst"
format = "pdf", "html"
[observation]
    name = "Observation"
    path = ../../shared_data/example/SST_L3MONOSENSOR.nc
[models]
    [[NEMO]]
        name = model_0
        path = ../../shared_data/example/nemo.nc
    [[CROCO]]
        name = model_1
        path = ../../shared_data/example/croco.south-africa.meridional.nc
[meta-zones]
    name = Meta-zone
    start = 2021-08-01T13:00:00
    end = -2
    polygon = [-5.8, 50.0], [-4.0, 48.0],[-7.3, 48.0], [-9.5, 49.0], [-9.0, 50.5], [-4.0, 51.0]
    cloud = [-5.8, 50.0], [-4.0, 48.0],[-7.3, 48.0], [-9.5, 49.0], [-9.0, 50.5], [-4.0, 51.0]
    time-restriction = 20, 5
    quality = 3, 5
[outputs]
    [[disp_diag_g]]
        plot = disp_diag_g
        attribute = temp_p
    [[map]]
        plot = map
        colormap = thermal
        vmin = 10
        vmax = 15
    [[time_series_p]]
        plot = time_series_p
        colormap = thermal
        vmin = 10
        vmax = 15