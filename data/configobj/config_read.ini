functionality = sst
output-path = ../../shared_output_data/
colocate = observation
format = "pdf", "html"
[observation]
    name = Observation
    path = ../../shared_data/example/SST_L3MONOSENSOR.nc
    method = nearest
    method-z = linear
[models]
    [[model_0]]
        name = model_0
        path = ../../shared_data/example/nemo.nc, ../../shared_data/example/croco.south-africa.meridional.nc
        method = linear
    [[model_1]]
        name = model_1
        path = ../../shared_data/example/croco.south-africa.meridional.nc
        method = nearest
[meta-zones]
    name = Meta-zone
    start = 2021-08-01T13:00:00
    end = -2
    radius = 1
    polygon = (-5.8, 50.0) , [-4.0, 48.0],[-7.3, 48.0], [-9.5, 49.0], [-9.0, 50.5], [-4.0, 51.0]
    cloud = [-5.8, 50.0], [-4.0, 48.0],[-7.3, 48.0], [-9.5, 49.0], [-9.0, 50.5], [-4.0, 51.0]
    times = 2021-08-01T13:00:00, 2021-08-02T13:00:00
    time-restriction = 20, 5
    quality = 3, 5
    bathy = 5, 10
    depth = 1.5
    interval = 5H
    vars = temp, sal, dens, sndspd, gbt, mld, uv
    time-highlight = 2021-08-01T13:00:00, 2021-08-02T13:00:00
    cyclic = "21/12", "21/03"
[outputs]
    [[disp_diag_g]]
        plot = disp_diag_g
        attribute = temp_p
    [[map]]
        plot = map
        colormap = thermal
        vmin = 10
        vmax = 15
    [[time_series_p]]
        plot = time_series_p
        colormap = thermal
        vmin = 10
        vmax = 15