functionality = currents_hfr
format = "html"
colocate = model
output_path = ../../figures_finales/
[observation]
    name = Fausse_obs
    path = ../../shared_data/models_obs/test_f8/OBS/cmems_pour_obs_hycom.nc
    method = nearest
[models]
    [[NEMO]]
        name = NEMO
        path = ../../shared_data/models_obs/test_f8/MOD/h_3D_med.nc,../../shared_data/models_obs/test_f8/MOD/u_3D_med.nc, ../../shared_data/models_obs/test_f8/MOD/v_3D_med.nc
        method = linear
	type = HYCOM_currents
[meta-zones]
    name = Meta-zone
    polygon = [6.5, 38.2], [6.5, 44.5],[11.4, 44.5], [11.4, 38.2]

[outputs]
    [[plot]]
        plot = plot_map_metr_ecart
	colormap = solar











