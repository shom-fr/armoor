functionality = prof_hydro_vessel
format = "html"
colocate = observation
output_path = ../../figures_finales/
[observation]
    name = Profilers
    path = ../../shared_data/models_obs/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
[models]
    [[NEMO]]
        name = NEMO
        path = ../../shared_data/models_obs/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method-z = linear
    [[REANA]]
        name = Reanalysis
        path = ../../shared_data/models_obs/test_f2/MODEL/global-reanalysis-phy-001-031-grepv2-mnstd-monthly_corrto_GL-PR-PF-62873.nc
        method = linear
        method-z = linear
    [meta-zones]
    name = Meta-zone
        start = 2001-01-05T00:00:00.000000000
        end = 2001-02-20T00:00:00.000000000
    radius = 50
    vars = temp
    depth= 0,500
[outputs]
    [[test]]
        plot = plot_profile_u
        attribute = temp