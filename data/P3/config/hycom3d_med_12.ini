[config_reg]
    name = "hycom3d_med"

[parameters]

    [[GIBRALTAR_CURRENT]]
    name = "12- Gibraltar - courant"
        [[[extent]]]
            lon_min = -7.0
            lon_max = -4.0
            lat_min = 35.5
            lat_max = 36.5
        [[[param_1]]]
            name = Courant modèle de surface
            func = visu_current
            var = suv
            rarification = 4
        [[[param_2]]]
            name = Courant modèle à 100 m
            func = visu_current
            var = uv
            depth = 100
            rarification = 4
        [[[param_3]]]
            name = Courant modèle à 200 m
            func = visu_current
            var = uv
            depth = 200
            rarification = 4
        [[[param_4]]]
            name = Courant modèle à 300 m
            func = visu_current
            var = uv
            depth = 300
            rarification = 4
