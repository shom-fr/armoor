[config_reg]
    name = "hycom3d_med"

[parameters]

    [[GIBRALTAR_TEMP]]
    name = "10- Gibraltar - température"
        [[[extent]]]
            lon_min = -7.0
            lon_max = -4.0
            lat_min = 35.5
            lat_max = 36.5
        [[[param_1]]]
            name = SST modèle
            func = visu_temp
            var = sst
        [[[param_2]]]
            name = Température modèle à 100 m
            func = visu_temp
            var = temp
            depth = 100
        [[[param_3]]]
            name = Température modèle à 200 m
            func = visu_temp
            var = temp
            depth = 200
        [[[param_4]]]
            name = Température modèle à 300 m
            func = visu_temp
            var = temp
            depth = 300
