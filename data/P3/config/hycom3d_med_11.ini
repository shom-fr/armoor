[config_reg]
    model = 'hycom3d'
    config = 'med'

[parameters]

    [[GIBRALTAR_SAL]]
    name = "11- Gibraltar - salinité"
        [[[extent]]]
            lon_min = -7.0
            lon_max = -4.0
            lat_min = 35.5
            lat_max = 36.5
        [[[param_1]]]
            name = SSS modèle
            func = visu_sal
            var = sss
        [[[param_2]]]
            name = Salinité modèle à 100 m
            func = visu_sal
            var = sal
            depth = 100
        [[[param_3]]]
            name = Salinité modèle à 200 m
            func = visu_sal
            var = sal
            depth = 200
        [[[param_4]]]
            name = Salinité modèle à 300 m
            func = visu_sal
            var = sal
            depth = 300