[config_reg]
    name = "hycom3d_med"

[parameters]

    [[SEA_SURFACE_SALINITY]]
    name = "2- salinité de surface"
        [[[param_1]]]
            name = SSS modèle
            func = visu_sal
            var = sss
        [[[param_2]]]
            name = Ecart de la SSS modèle avec une climatologie
            func = visu_diff_sss
            var = sss
            obs = woa18
        [[[param_3]]]
            name = Débits des fleuves
            func = visu_runoff
            var = RVFL
            forcing_model = rivers
        [[[param_4]]]
            name = Précipitations
            func = visu_precip
            var = tp
            forcing_model = "atmfrc/cumul"