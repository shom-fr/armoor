[legend]
    [[visu_temp]]
        var_name = 'Temperature'
        var_unit = '(°C)'
        cmap = 'cmo.thermal'
    [[visu_sal]]
        var_name = 'Salinity'
        var_unit = '(1e-3)'
        cmap = 'cmo.haline'
    [[visu_current]]
        var_name = 'Current'
        var_unit = '(m/s)'
        cmap = 'cmo.thermal'
    [[visu_windforcing]]
        var_name = 'Wind 10m'
        var_unit = '(m/s)'
