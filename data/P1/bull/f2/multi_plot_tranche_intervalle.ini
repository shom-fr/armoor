functionality = prof_hydro_vessel
colocate = observation

[observation]
    name = Profilers
    path = data/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear

[models]
    [[NEMO]]
        name = NEMO
        path = data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method-z = linear

[outputs]
    [[plot_diag_disp]]
        plot = diag_disp
        colormap = thermal
        attribute = temp
    [[plot_map_metr_biais]]
        plot = plot_map_metr_biais
	    colormap = solar
        attribute = temp
    [[plot_map_metr_RMSEc]]
        plot = plot_map_metr_RMSEc
	    colormap = solar
        attribute = temp
    [[plot_map_metr_RMSEcentree]]
        plot = plot_map_metr_RMSEcentree
	    colormap = solar
        attribute = temp



