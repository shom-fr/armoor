functionality = prof_hydro_mooring
colocate = observation
output_path = ./

[observation]
    name = Profilers
    path = ../data/test_f3/OBS/BO_TS_MO_BrofjordenWR_201901.nc
    method = nearest
    method_z = nearest
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f3/MODEL/dataset-cmems_pour_obsMO2.nc
        method = nearest
        method_z = nearest

[meta_zone]
    name = Meta-zone
    start = 2019-01-05T00:00:00.0000
    end = 2019-01-10T00:00:00.0000
    vars = temp
    interval = 24h
    radius = 2
   
 
[outputs]
    [[plot_ser_temp_stat_SCA]]
        plot = plot_ts_metr_f3
        attribute = temp
