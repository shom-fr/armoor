functionality = prof_hydro_mooring
colocate = observation
output_path = ./
[observation]
    name = Mooring
    path = ../data/test_f3/OBS/BO_TS_MO_BrofjordenWR_201901.nc
#    path = ../data/test_f3/OBS/IR_TS_MO_6200024_202403.nc
    method = nearest
    method_z = nearest
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f3/MODEL/dataset-cmems_pour_obsMO2.nc
#        path = ../data/test_f3/MODEL/cmems_mod_ibi_phy_anfc_0.027deg-3D_PT1H-m_1713193850090.nc
        method = nearest
        method_z = nearest

[meta_zone]
    name = meta-zone 1
    start = 2019-01-05T00:00:00
    end = 2019-01-10T00:00:00
    #start = 2024-04-01T00:00:00
    #end = 2024-04-30T00:00:00
    radius = 2
    interval = 24 h
    vars = temp#, sound_speed
    depth = 50

[outputs]
    [[plot_ser_temp_stat]]
        plot = plot_ts_metr_stats
        attribute = temp#, sound_speed
