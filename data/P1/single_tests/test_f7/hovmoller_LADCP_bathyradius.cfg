functionality = currents_ADCP
colocate = observation
output_path = ./
[observation]
    name = L-ADCP
    path = ../data/test_f7/OBS/PF006.txt
    method = nearest
    method_z = nearest
    type = LADCP

[models]
    [[NEMO]]
        name = HYCOM3D
        path = ../data/test_f7/MODEL/HYCOM/HYCOM_Nazare_20100512_20100513/h_nazare.nc, ../data/test_f7/MODEL/HYCOM/HYCOM_Nazare_20100512_20100513/u_nazare.nc, ../data/test_f7/MODEL/HYCOM/HYCOM_Nazare_20100512_20100513/v_nazare.nc
        method = nearest
        type = HYCOM_currents

[meta_zone]
    name = meta-zone empty
    bathy_min = 50
    radius = 20

[outputs]
    [[plot_hovmoller_LADCP_bathyradius]]
        plot = plot_hovmoller
        attribute = current
	





