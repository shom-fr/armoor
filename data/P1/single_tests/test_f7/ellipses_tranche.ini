functionality = currents_ADCP
colocate = observation
output_path = ./
[observation]
    name = L-ADCP
    path = ../data/test_f7/LADCP_PF006.txt
    method = nearest
    type = LADCP

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f7/model_pour_LADCP.nc
        method = nearest

[meta_zone]
    name = meta-zone 1
    min_depth= 0
    max_depth =100
    slice = 0,30,60,100,170

[outputs]
    [[figure_tout]]
        plot = plot_tide_current_ellipses
        tidal_waves = " M2 S2 K1 O1 P1 Q1 N2 2N2 L2 La2 E2 L2 J1 Mu2 Nu2"
        path_results = ../output_test_f7/results_comodo
        path_comodo = /SOFTS/oceano/tools/TOOLS-CENTOS-HPC_maj_20230420/src/
        env_comodo =  
        scale = 0.2


