functionality = currents_ADCP
colocate = observation
output_path = ./
[observation]
    name = L-ADCP
    path = ../data/test_f7/adcp_90534.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f7/faux_model_pour_adcp90534.nc
        method = linear

[meta_zone]
    name = meta-zone 1
    min_depth= 20
    max_depth =90
    slice = [20,50],[50,90]]

[outputs]
    [[figure_tout]]
        plot = harmonic_table
        tidal_waves = " M2 S2 K1 O1 P1 Q1 N2 2N2 L2 La2 E2 L2 J1 Mu2 Nu2"
        tide_tool = utide





