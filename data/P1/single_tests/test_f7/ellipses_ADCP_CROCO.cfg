functionality = currents_ADCP
format = "html"
colocate = observation
output_path = ./
[observation]
    name = ADCP
    path = ../data/test_f7/OBS/F4702_AWAK_C1_4948_sub.txt
    method = nearest
    type = mouillage
[models]
    [[CROCO]]
        name = CROCO
        path = ../data/test_f7/MODEL/extract_GROIX_10M_F4702_2017_5L_init_his_sub.nc
        method = nearest
	method_z = nearest
        type = CROCO
[meta_zone]
    name = Meta-zone
    max_depth = 9
[outputs]
    [[plot]]
        plot = plot_tide_current_ellipses
        tidal_waves = "M2 K1 S2 O1"
	    scale = 0.8
        tide_tool = ttide

