functionality = currents_ADCP
format = "html"
colocate = observation
output_path = ./
[observation]
    name = ADCP
    path = ../data/test_VA_2/F4702_AWAK_C1_4948.txt
    method = nearest
    type = mouillage
[models]
    [[CROCO]]
        name = CROCO
        path = ../data/test_VA_2/extract_GROIX_10M_F4702_2017_5L_his.nc
        method = nearest
	method_z = nearest
        type = CROCO
[meta_zone]
    name = Meta-zone
    depth = 9
[outputs]
    [[plot_ellipses_ADCP_CROCO]]
        plot = plot_tide_current_ellipses
        tidal_waves = "M2 K1 S2 O1"
	    scale = 0.8, 10, 4, 15
        tide_tool = utide

