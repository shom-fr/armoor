functionality = currents_ADCP
colocate = observation
output_path = ./
[observation]
    name = L-ADCP
    path = ../data/test_f7/adcp_90534.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f7/faux_model_pour_adcp90534.nc
        method = linear

[meta_zone]
    name = meta-zone 1

[outputs]
    [[figure_tout]]
        plot = plot_tide_current_ellipses
        tidal_waves = " M2 K1"
        scale = 1
        tide_tool = utide









