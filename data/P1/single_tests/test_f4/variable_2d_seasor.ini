functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = seasoar
    path = ../data/test_f4/GT1_seasoar.txt
    type = seasoar
    method = nearest
    method_z = nearest
[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f4/cmems_mod_glo_phy_pour_seasoar.nc
        method = linear
        method_z = linear
[meta_zone]
    name = Meta-zone
    vars = mld
    depth = 50

[outputs]
    [[figure_tout]]
        attribute = mld
        plot = plot_variable_2d
