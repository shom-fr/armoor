functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = radiale glider
    path = ../data/test_f4/OBS/GL_PR_GL_64556_sub.nc
    method = linear
    method_z = linear
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f4/MODEL/cmems_mod_glo_phy_forGL_PR_GL_64556.nc
        method = linear
        method_z = linear

[meta_zone]
    name = Meta-zone
    vars = temp, sal
    depth = 50

[outputs]
    [[test]]
        plot = plot_variable_2d
        attribute = temp, sal
