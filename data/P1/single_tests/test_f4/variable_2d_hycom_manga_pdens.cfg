functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = radiale glider
    path = ../data/test_f4/OBS/GL_PR_PF_7900573_202203_for_manga.nc
    method = linear
    method_z = linear
    type = CMEMS

[models]
    [[HYCOM_3D]]
        name = HYCOM_3D
        path =  ../data/test_f4/MODEL/h_3D_manga_sub_modified.nc, ../data/test_f4/MODEL/saln_3D_manga_sub_modified.nc, ../data/test_f4/MODEL/temp_3D_manga_sub_modified.nc
        method = linear
        method_z = linear
	type = HYCOM_3D

[meta_zone]
    name = meta-zone empty
    start = 2022-03-09T00:00:00.000000000
    end = 2022-03-18T00:00:00.000000000
    vars = mld

[outputs]
    [[plot_variable_2d_hycom_manga_pdens]]
        plot = plot_variable_2d
        # colormap = Blues
        attribute = mld_pdens
