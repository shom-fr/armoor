functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = radiale glider
    path = ../data/test_f4/GL_PR_GL_64556_sub.nc
    method = nearest
    method_z = nearest
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f4/cmems_mod_glo_phy_forGL_PR_GL_64556.nc
        method = linear
        method_z = linear

[meta_zone]
    name = meta-zone 1
    start = 2005-12-05T00:00:00
    end = 2005-12-10T00:00:00
    depth = 10
    quality = TEMP_QC,0,1

[outputs]
    [[figure_tout]]
        plot = plot_variable_2d
	attribute = current_geo
