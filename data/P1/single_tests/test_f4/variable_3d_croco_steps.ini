functionality = section_hydro
colocate = observation
horizontal_step = 0.1
vertical_step = 40

[observation]
    name = radiale glider
    path = ../data/test_f4/GL_PR_GL_64556.nc
    method = nearest
    method_z = nearest
    type = CMEMS

[models]
    [[NEMO]]
        name = CROCO
        path = ../data/test_f1/MODEL/CROCO_loire.nc
	type = CROCO
        method = linear
        method_z = linear

[meta_zone]
    name = meta-zone 2
    vars = temp, sal

[outputs]
    [[figure_tout]]
        plot = plot_variable_3d
        # colormap = Blues
        attribute = temp, sal
