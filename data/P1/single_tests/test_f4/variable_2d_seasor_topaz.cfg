functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = seasoar
    path = ../data/test_f4/OBS/GT1_seasoar_for_topaz.txt
    type = seasoar
    method = nearest
    method_z = nearest
[models]
    [[TOPAZ]]
        name = TOPAZ
        path = ../data/test_f4/MODEL/topaz_for_seasoar.nc
        method = linear
        method_z = linear
[meta_zone]
    name = Meta-zone
    depth = 50
    vars = mld

[outputs]
    [[plot_variable_2d_seasor_topaz]]
        attribute = mld_ptemp
        plot = plot_variable_2d
