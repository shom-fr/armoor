functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 2
output_path = ./
[observation]
    name = seasoar
    path = ../data/test_f4/OBS/GT1_seasoar.txt
    type = seasoar
    method = nearest
    method_z = nearest
[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f4/MODEL/cmems_mod_glo_phy_pour_seasoar.nc
        method = linear
        method_z = linear
[meta_zone]
    name = Meta-zone


[outputs]
    [[plot_variable_2d_seasor]]
        attribute = mld_ptemp
        plot = plot_variable_2d
