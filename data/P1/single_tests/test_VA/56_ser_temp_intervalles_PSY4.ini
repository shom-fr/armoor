functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[observation]
    name = Profilers
# du 16 Avril 2000 au 1 decembre 2002 par pas de 10 a 50 jours 
    path = ../data/test_VA/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
# du 16 Avril 2000  au 16 Novembre 2002 - 1 donnee mensuelle 
        path = ../data/test_VA/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method_z = linear

[meta_zone]
    name = Meta-zone
    start = 2001-01-01T00:00:00.0000
    end = 2001-12-31T00:00:00.0000
    vars = temp
#    interval = 2000h
    min_depth = 0
    max_depth = 150
    slice = 0,20,60,120
   
 
[outputs]
    [[test]]
        plot = plot_ts_metr_stats
        colormap = solar
        attribute = temp
