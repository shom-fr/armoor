functionality = currents_hfr
colocate = observation
output_path = ./

[observation]
# fichier du 31 jan 2021 00J au 31 janv 2021 13h47
    name = IROISE
    path = ../data/test_VA/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[NEMO]]
# fichier du 30 janvier 2021 18h30 au 1er fevrier 23h30 par pas de 1h
        name = NEMO
        path = ../data/test_VA/global-analysis-forecast-pour_IROISE.nc
        method = nearest

   
[meta_zone]
   name = meta-zone
   polygon = [-5,48.3], [-5,48.6], [-5.2,48.6], [-5.2,48.3]
   interval = 3H

[outputs]
    [[plot]]
        plot = plot_ts_metr_stats
        attribute = current











