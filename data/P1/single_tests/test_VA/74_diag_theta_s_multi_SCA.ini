functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[observation]
    name = Profilers
    path = ../data/test_VA/AR_PR_CT_58UO_201901.nc
    method = nearest
    method_z = linear
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_VA/global-analysis-forecast-phy-001-024_201901_correspto_AR_PR_CT_58UO.nc
        method = linear
        method_z = linear
	

[meta_zone]
    name = Meta-zone
    start = 2019-01-09T00:00:00.0000
    end = 2019-01-15T00:00:00.0000
    radius = 1
    interval = 24h
    depth = 0,500
 
[outputs]
    [[test]]
        plot = diag_ts_multi
        # colormap = Blues
        attribute = temp, sal
