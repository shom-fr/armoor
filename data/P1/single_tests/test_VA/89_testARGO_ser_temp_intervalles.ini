functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[observation]
    name = Profilers
    path = ../data/test_VA/GL_PR_PF_3901890_201801.nc
    method = nearest
    method_z = linear
    type = CMEMS
[models]
    [[HYCOM]]
        name = HYCOM
        type = 'HYCOM_3D'
        path = ../data/test_VA/h_3D_aeg.nc, ../data/test_VA/temp_3D_aeg.nc, ../data/test_VA/saln_3D_aeg.nc 
        method = linear
        method-z = linear

#    [[NEMO]]
