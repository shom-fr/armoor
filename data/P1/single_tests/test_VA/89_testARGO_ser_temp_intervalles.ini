#        method-z = linear


[meta_zone]
    name = medor
    start = 2018-01-01T00:00:00.000000000
    end = 2018-01-31T00:00:00.000000000
    vars = sndspd, temp
    depth = 0, 500
    slice = 0,10,200,500
