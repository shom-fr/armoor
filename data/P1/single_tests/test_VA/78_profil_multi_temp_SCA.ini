functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[observation]
    name = Profilers
    path = ../data/test_VA/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_VA/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = nearest
        method_z = linear
  #  [[REANA]]
  #      name = Reanalysis
   #     path = ../data/test_VA/global-reanalysis-phy-001-031-grepv2-mnstd-monthly_corrto_GL-PR-PF-62873.nc
    #    method = nearest
     #   method_z = linear

[meta_zone]
    name = Meta-zone
    start = 2001-01-01T00:00:00.0000
    end = 2001-03-31T00:00:00.0000
    interval = 500h
#    cyclic = winter
    vars = temp
    min_depth = 0
    max_depth = 50
    radius = 50
 
[outputs]
    [[test]]
        plot = plot_profile_multi 
        attribute = temp
