functionality = currents_hfr
colocate = model
output_path = ./


[observation]
    name = IROISE
# du donnee du 31 janvier avec un pas de 10min 
    path = ../data/test_f6/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[NEMO]]
# donnees du 
        name = NEMO
# du 30 janvier 2021 18h30 au 1er fevrier 2021 23:30 par pas de 1h 
        path = ../data/test_f6/global-analysis-forecast-pour_IROISE.nc
        method = nearest

[meta_zone]
    name = IROISE
    start = 2021-01-31T00
    end = 2021-01-31T13

[outputs]
    [[plot]]
        plot = plot_map_metr_ecart
        colormap = solar
        vmin = 0
        vmax = 0.5











