functionality = prof_hydro_vessel
colocate = observation

[meta_zone]
    vars = temp, sal
    radius = 5
    #depth = 0, 100
    interval = 24H
[observation]
    name = TEMP
    path = ../data/test_VA/7900573_prof.nc
    method = nearest
    type=CORA
[models]
    [[psy4]]
        name = psy4
        path = ../data/test_VA/MERCATOR_PSY4V3_20220322.nc, ../data/test_VA/MERCATOR_PSY4V3_20220323.nc
        method = nearest
[outputs]
    [[plot_map_metr_ecart]]
        plot = diag_ts_multi
        attribute = temp, sal


