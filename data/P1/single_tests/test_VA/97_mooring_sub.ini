functionality = prof_hydro_mooring
colocate = observation
output_path = ./

[observation]
    name = GL_TS_MO_6200080_202303
    path = ../data/test_VA/GL_TS_MO_6200080_202303_sub.nc
    type = CMEMS

[models]
    [[hycommanga-dailyanalysis]]
        name = hycom3dmanga-dailyanalysis
        path = ../data/test_VA/hycom3d_model_output.3d-hycom3d-h-none.manga.netcdf,../data/test_VA/hycom3d_model_output.3d-hycom3d-temp-none.manga.netcdf,../data/test_VA/hycom3d_model_output.3d-hycom3d-saln-none.manga.netcdf
        type = HYCOM_3D
        method = linear
        method_z = linear

[meta_zone]
    name = meta-zone 1
    radius = 10

[outputs]
    [[moorings]]
        plot = plot_ts_metr_stats
        attribute = temp

