functionality = currents_hfr
colocate = observation
output_path=./
[observation]
    name = RHF-IROISE
    path = ../data/test_VA_2/2020_C2D_CUR_FILT.nc
    method = nearest

[models]
    [[HYCOM2D]]
        name = HYCOM-DCSMM
        # path = ../data/test_VA_2/u_2D_miniiroise_20200501.nc,../data/test_VA_2/v_2D_miniiroise_20200501.nc
	path = ../data/test_VA_2/u_2D_iroise_2020.nc,../data/test_VA_2/v_2D_iroise_2020.nc
        method = nearest
	type = HYCOM_currents

[meta_zone]
    name = iroise
    cloud= [ [-5.5932, 48.2948], [-5.5932, 48.4747], [-5.3227, 48.2228], [-5.3227, 48.3847], [-5.3227, 48.5827], [-5.0793, 48.3127] ]

[outputs]
    [[figure_tout]]
        plot = plot_ts_metr_point
        attribute = current_res
	low_pass_filter = godin









