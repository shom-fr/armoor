functionality = clim_hydro
colocate = model
output_path = ./

[observation]
    name = Clim_WOA18
     path = ../data/test_VA_2/woa18_decav_s01_04.nc,../data/test_VA_2/woa18_decav_s02_04.nc,../data/test_VA_2/woa18_decav_s03_04.nc,../data/test_VA_2/woa18_decav_s04_04.nc,../data/test_VA_2/woa18_decav_s05_04.nc,../data/test_VA_2/woa18_decav_s06_04.nc,../data/test_VA_2/woa18_decav_s07_04.nc,../data/test_VA_2/woa18_decav_s08_04.nc,../data/test_VA_2/woa18_decav_s09_04.nc,../data/test_VA_2/woa18_decav_s10_04.nc,../data/test_VA_2/woa18_decav_s11_04.nc,../data/test_VA_2/woa18_decav_s12_04.nc
    method = nearest
    type = WOA18

[models]
    [[HYCOM3D]]
        name = HYCOM-DCSMM
        path = ../data/test_VA_2/h_3D_Iroise_2017_daily.nc, ../data/test_VA_2/saln_3D_Iroise_2017_daily.nc
        method = nearest
        type = HYCOM_3D

[meta_zone]
    name = Iroise
    cloud = [ [-6.2, 47.4], [-5.5, 48.25] ]
    depth = 5,100

[outputs]
    [[figure_tout]]
        plot = plot_ts_metr_ecart_point
        attribute = sal










