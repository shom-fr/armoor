functionality = section_hydro
colocate = observation
horizontal_step = 10
vertical_step = 50
output_path = ./ #/data3/mmorvan/Armoor/VA-tests/profhydromooring_f3/
[observation]
    name = radiale glider
    path = ../data/test_VA_2/GL_PR_GL_8901012_202304.nc
    method = linear
    method_z = linear
    type = CMEMS

[models]
    [[daily_0day_forecast]]
        name = HYCOM_3D
        path   = ../data/test_VA_2/hycom3d_model_output.3d-hycom3d-h-none.medoc.netcdf,../data/test_VA_2/hycom3d_model_output.3d-hycom3d-saln-none.medoc.netcdf,../data/test_VA_2/hycom3d_model_output.3d-hycom3d-temp-none.medoc.netcdf,
        method = linear
        method_z = linear
	    type = HYCOM_3D

[meta_zone]
    name    = medoc
    start   = 2023-04-08T00:00:00
    end     = 2023-04-11T00:00:00
[outputs]
    [[sections]]
        plot = plot_variable_3d
        attribute = temp, sal
