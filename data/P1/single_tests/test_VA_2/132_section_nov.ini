functionality = currents_VMADCP
colocate = observation
vertical_step = 10
horizontal_step = 50
output_path = ./
[observation]
    name = VM-ADCP
    path = ../data/test_VA_2/AT-WEMSWOT-38khz-PORTMAHON-LASEYNE_070-STA_55levels.txt
    method = linear
    method_z = linear
    type = VMADCP

[models]
    [[daily_0day_forecast]]
        name = HYCOM_3D
        path   = ../data/test_VA_2/132hycom3d_model_output.3d-hycom3d-h-none.medoc.netcdf,../data/test_VA_2/132hycom3d_model_output.3d-hycom3d-u-none.medoc.netcdf,../data/test_VA_2/132hycom3d_model_output.3d-hycom3d-v-none.medoc.netcdf,
        method = linear
        method_z = linear
	    type = HYCOM_3D

[meta_zone]
    name = medoc
    
[outputs]
    [[figure_tout]]
        plot = plot_variable_3d
