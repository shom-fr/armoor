functionality = currents_hfr
colocate = model
output_path = ./
[observation]
    name = Fausse_obs
    path = ../data/test_f8/OBS/cmems_pour_obs_hycom.nc
    method = nearest

[models]
    [[HYCOM3D]]
        name = HYCOM3D
        path = ../data/test_f8/MOD/h_3D_med.nc,../data/test_f8/MOD/u_3D_med.nc, ../data/test_f8/MOD/v_3D_med.nc
        method = linear
	type = HYCOM_currents
    [[HYCOM2D]]
        name = HYCOM2D
        path = ../data/test_f8/MOD/u_2D_med.nc, ../data/test_f8/MOD/v_2D_med.nc
        method = linear
	    type = HYCOM_currents

[meta_zone]
    name = meta-zone 4
    polygon = [6.5, 38.2], [6.5, 44.5],[11.4, 44.5], [11.4, 38.2]
    start = 2022-03-09T00:00:00.000000000
    end = 2022-03-09T05:00:00.000000000

[outputs]
    [[figure_tout]]
        plot = plot_map_metr_ecart
	    colormap = solar











