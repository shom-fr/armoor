functionality = currents_hfr
colocate = model
output_path = ./
[observation]
    name = IROISE
    path = ../data/test_f6/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[HYCOM3D]]
        name = HYCOM3D
        path = ../data/test_f6/MODEL/h_3D.nc,../data/test_f6/MODEL/u_3D.nc, ../data/test_f6/MODEL/v_3D.nc
        method = linear
	type = HYCOM_currents
    [[HYCOM2D]]
        name = HYCOM2D
        path = ../data/test_f6/MODEL/u_2D.nc, ../data/test_f6/MODEL/v_2D.nc
        method = linear
	    type = HYCOM_currents

[meta_zone]
    name = meta-zone 2
    polygon = [-4.7, 48], [-4.7, 48.75],[-5.7, 48.75], [-5.7, 48]
    start = 2021-01-31T00:00:00.000000000
    end = 2021-01-31T05:00:00.000000000

[outputs]
    [[figure_tout]]
        plot = plot_map_metr_ecart
	    colormap = solar











