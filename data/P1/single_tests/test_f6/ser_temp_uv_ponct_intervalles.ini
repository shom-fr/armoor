functionality = currents_hfr
colocate = observation
output_path = ./
[observation]
    name = IROISE_HFR
    path = ../data/test_f6/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/cmems_mod_glo_phy_anfc_merged-uv_PT1H-i_1710515669134.nc
        method = nearest

[meta_zone]
    name = meta-zone 1
    cloud= [ [-5.4, 48.3], [-5.2, 48.15] ]
    interval = 3H

[outputs]
    [[figure_tout]]
        plot = plot_ts_metr_point
        attribute = current











