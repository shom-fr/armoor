functionality = currents_hfr
colocate = observation
output_path = ./
[observation]
    name = IROISE
    path = ../data/test_f6/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/global-analysis-forecast-pour_IROISE.nc
        method = nearest

[meta_zone]
    name = meta-zone 5
    cloud= [ [-5, 48.3], [-5.2, 48.6] ]
    interval = 3H

[outputs]
    [[figure_tout]]
        plot = plot_ts_metr_point
        attribute = current











