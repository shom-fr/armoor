functionality = currents_hfr
colocate = observation
output_path = ./
[observation]
    name = IROISE_HFR
    path = ../data/test_f6/OBS/RadarHF_VIG_TR_C2D_CUR_FILT_2017-01-tout.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/MODEL/IBI_2017-01.nc
        method = nearest

[meta_zone]
    name = meta-zone 6
    polygon = [-5, 48.3], [-5, 48.6],[-5.2, 48.6], [-5.2, 48.3]
    interval = 48H

[outputs]
    [[plot_ser_temp_uv_res_stat_intervalles]]
        plot = plot_ts_metr_stats
        attribute = current_res
        low_pass_filter = demerliac











