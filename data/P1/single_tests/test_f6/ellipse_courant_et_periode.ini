    name = IROISE
    path = ../data/test_f6/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/cmems_mod_glo_uv.nc
        method = nearest

[meta-zones]
    name = meta-zone 1
    cloud= [ [-5, 48.3], [-5.2, 48.6] ]

