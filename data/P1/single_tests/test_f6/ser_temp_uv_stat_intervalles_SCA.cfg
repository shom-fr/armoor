functionality = currents_hfr
colocate = observation
output_path = ./
[observation]
    name = IROISE_HFR
    path = ../data/test_f6/OBS/RADARHF_OBS_R1110_IROISE_20210131.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/MODEL/cmems_mod_glo_phy_anfc_merged-uv_PT1H-i_1710515669134.nc
        method = nearest

   
[meta_zone]
   name = meta-zone
   polygon = [-5,48.3], [-5,48.6], [-5.2,48.6], [-5.2,48.3]
   interval = 3H

[outputs]
    [[plot_ser_temp_uv_res_stat_intervalles_SCA]]
        plot = plot_ts_metr_stats
        attribute = current_res
	low_pass_filter = demerliac











