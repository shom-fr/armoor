functionality = currents_hfr
colocate = model
output_path = ./
[observation]
    name = IROISE_HFR
    path = ../data/test_f6/RadarHF_VIG_TR_C2D_CUR_FILT_2017-01-tout.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/IBI_2017-01.nc
        method = nearest

[meta_zone]
    name = meta-zone 3
    polygon = [-4.7, 48], [-4.7, 48.75],[-5.7, 48.75], [-5.7, 48]
    interval = 48H
    start = 2017-01-01
#     end = 2017-01-30
[outputs]
    [[figure_tout]]
        plot = plot_map_metr_biais
        colormap = solar
        attribute = current_res
        low_pass_filter = demerliac











