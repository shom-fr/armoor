functionality = currents_hfr
colocate = observation
output_path = ./
[observation]
    name = IROISE
    path = ../data/test_f6/RadarHF_VIG_TR_C2D_CUR_FILT_2017-01-tout.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f6/IBI_2017-01.nc
        method = nearest

[meta_zone]
    name = meta-zone 1
    cloud= [ [-5, 48.3], [-5.2, 48.6] ]

[outputs]
    [[figure_tout]]
        plot = plot_ts_metr_point
        attribute = current_res
        low_pass_filter = demerliac











