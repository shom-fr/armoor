functionality = prof_hydro_vessel
colocate = observation
output_path = ./
[observation]
    name = Profilers
    path = ../data/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type=CMEMS
[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method_z = linear
[meta_zone]
    name = Meta-zone
    start = 2001-01-01T00:00:00.000000000
    end = 2001-12-31T00:00:00.000000000
    interval = 2000h
    vars = temp
    depth= 0,150
    slice= 0,30,60,100,170
[outputs]
    [[figure_tout]]
        plot = diag_disp
        colormap = thermal
        attribute = temp



