functionality = prof_hydro_vessel
colocate = observation
output_path = ./
[observation]
    name = Profilers
    path = ../data/test_f2/OBS/GL_PR_PF_3902519_202305.nc, ../data/test_f2/OBS/GL_PR_PF_7901066_202305.nc, ../data/test_f2/OBS/GL_PR_PF_3902506_202307.nc
    method = nearest
    method_z = linear
    type=CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f2/MODEL/cmems_mod_ibi_phy_anfc_0.027deg-3D_P1D-m_1701362595494.nc
        method = linear
        method_z = linear

[meta_zone]
    name = meta-zone 1
    vars = temp
    min_depth= 0
    max_depth =150

[outputs]
    [[figure_tout]]
        plot = diag_disp_g
        colormap = thermal
        attribute = temp



