functionality = prof_hydro_vessel
colocate = observation
output_path = ./
[observation]
    name = Profilers
    path = ../data/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method_z = linear

[meta_zone]
    name = Meta-zone
    start = 2001-01-01T00:00:00.0000
    end = 2001-12-31T00:00:00.0000
    vars = temp
    min_depth = 0
    max_depth = 150
    slice = [[0,20], [20,60],[60,150]]
 
[outputs]
    [[test]]
        plot = plot_ts_metr_stats
        colormap = solar
        attribute = temp
