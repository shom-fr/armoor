functionality = prof_hydro_vessel
colocate = observation

[observation]
    name = Profilers
    path = ../data/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type=CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method-z = linear

[meta_zone]
    name = meta-zone 6
    start = 2001-01-01T00:00:00
    end = 2001-12-31T00:00:00
    interval = 2000h
    vars = temp
    depth= 0,150
    slice=50

[outputs]
    [[figure_tout]]
        plot = diag_disp
        colormap = thermal
        attribute = temp
    [[figure_tout1]]
        plot = plot_map_metr_biais
	    colormap = solar
        attribute = temp
    [[figure_tout2]]
        plot = plot_map_metr_RMSEc
	    colormap = solar
        attribute = temp
    [[figure_tout3]]
        plot = plot_map_metr_RMSEcentree
	    colormap = solar
        attribute = temp



