functionality = prof_hydro_vessel
colocate = observation
output_path = ./
[observation]
    name = Profilers
    path = ../data/test_f2/OBS/GL_PR_PF_62873_renamed.nc
    method = nearest
    method_z = linear
    type = CMEMS

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f2/MODEL/cmems_mod_glo_phy_my_0.083_P1M-m_correspondingtoGL-PR-PF-62873.nc
        method = linear
        method_z = linear
    [[REANA]]
        name = CMEMS_GLOBAL_REANALYSIS
        path = ../data/test_f2/MODEL/global-reanalysis-phy-001-031-grepv2-mnstd-monthly_corrto_GL-PR-PF-62873.nc
        method = linear
        method_z = linear

[meta_zone]
    name = meta-zone 10
    start = 2001-01-05T00:00:00
    end = 2001-12-20T00:00:00
    radius = 30
    interval = 20 d
    vars = temp
    min_depth= 0
    max_depth =500

[outputs]
    [[figure_tout]]
        plot = plot_profile_multi 
        attribute = temp
