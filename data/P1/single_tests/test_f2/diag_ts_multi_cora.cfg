functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[meta_zone]
    vars = temp
    #depth = 0, 100
    radius = 5
    interval = 5H
[observation]
    name = TEMP
    path = ../data/test_f2/OBS/7900573_prof.nc
    method = nearest
    type = CORA
[models]
    [[psy4]]
        name = psy4
        path = ../data/test_f2/MODEL/MERCATOR_PSY4V3_20220322.nc,../data/test_f2/MODEL/MERCATOR_PSY4V3_20220323.nc
        method = nearest
        method_z = nearest
[outputs]
    [[plot_map_metr_ecart]]
        plot = diag_ts_multi
        attribute = temp, sal


