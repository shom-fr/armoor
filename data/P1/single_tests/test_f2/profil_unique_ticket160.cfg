functionality = prof_hydro_vessel
colocate = observation
output_path = ./

[observation]
    name     = cmems-profiling-floats
    path     = ../data/test_VA_2/GL_PR_PF_6903133_202304.nc
    method   = linear
    type     = CMEMS
    
[models]
    [[daily_0day_forecast]]
        name   = sloop-hycom3d-medoc-daily_0day_forecast
        path   = ../data/test_VA_2/hycom3d-h.medoc.netcdf,../data/test_VA_2/hycom3d-temp.medoc.netcdf, ../data/test_VA_2/hycom3d-saln.medoc.netcdf
        method = linear
        method_z = linear
        type = HYCOM_3D

[meta_zone]
    name    = medoc
    start   = 2023-04-08T00:00:00
#    end     = 2023-04-13T00:00:00
    end = 2023-04-09T00:00:00
    radius = 50
    vars = temp,sal,sound_speed


[outputs]
    [[plot_profile_unique_ticket160]]
        plot = plot_profile_u
        attribute = sound_speed, temp
