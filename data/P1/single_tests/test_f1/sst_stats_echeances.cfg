functionality = sst
colocate = observation
output_path = ./

[observation]
    name = "TEMP"
    path = ../data/test_f1/OBS/extract_METOFFICE-GLO-SST-L4-REP-OBS-SST_2020.nc
    method = nearest
[models]
    [[PSY4]]
        name = PSY4
        path = ../data/test_f1/MODEL/extract_sst_mercator_2020.nc
        method = nearest

[meta_zone]
    name = Meta-zone_polygon
    polygon = [51.8,15.8], [41.2, 12.],[44.7, 9.8], [51., 11.8]
    times = 2020-01-01T00:00:00.000000000, 2020-03-01T00:00:00.000000000, 2020-05-01T00:00:00.000000000, 2020-07-01T00:00:00.000000000, 2020-09-01T00:00:00.000000000, 2020-11-01T00:00:00.000000000, 2020-12-01T00:00:00.000000000

[outputs]
    [[plot_ts_metr_stats_echeances]]
        plot = plot_ts_metr_stats
        colormap = solar
        attribute = SST


