functionality = sst
colocate = auto
output_path = ./

[observation]
    name = "ARMOR3D REP"
    path = ../data/test_f1/OBS/data_sst_L4_global.nc
    method = nearest

[models]
    [[CROCO]]
        name = CROCO
        path = ../data/test_f1/MODEL/NATL_Y2008M05_sub.nc
        method = nearest
        type = CROCO

[meta_zone]
	depth = 5
	polygon = [-84.,16.], [-73., 16.],[-73., 8], [-84., 8.]


[outputs]
    [[plot_map_biais]]
        plot = plot_map_metr_ecart
        colormap = solar
        attribute = SST

