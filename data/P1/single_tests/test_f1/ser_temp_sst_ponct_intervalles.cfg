functionality = sst
colocate = observation
output_path = ./
[observation]
    name = Observation
    path = ../data/test_f1/OBS/obs_frommodel_pour_test_colder.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f1/MODEL/model_pour_test_colder.nc
        method = nearest
    [[NEMO_shifted]]
        name = NEMO_shifted
        path =../data/test_f1/MODEL/model_pour_test_colder3.nc
        method = nearest

[meta_zone]
    name = "cloud interval"
    cloud= [ [-8.8, 47.2], [-8.7, 47.3] ]
    interval = 24H

[outputs]
    [[plot_ser_temp_sst_ponct_intervalles]]
        plot = plot_ts_metr_point










