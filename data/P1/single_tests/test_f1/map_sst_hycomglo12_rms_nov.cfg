functionality = sst
colocate = observation
format = "pdf", "html"
output_path = ./
[observation]
    name = "L3C"
    path = ../data/test_VA_2/01-extract.nc, ../data/test_VA_2/02-extract.nc, ../data/test_VA_2/03-extract.nc  
    method = linear
[models]
    [[HYCOM-GLO12]]
        name = HYCOM-GLO12
        path = ../data/test_VA_2/daily_sst.nc
        method = linear
[meta_zone]
        name = "full med"
        description = full med
        polygon = [-7.0,30.2], [36.0, 30.2],[36.0, 45.8], [2.50, 45.8], [-1.2, 43.0], [-7.0, 40.4]
        start = 2022-01-01T00:00:00
        end = 2022-04-01T23:00:00
        interval = '1MS'
        quality = quality_level, 1, 2 
[outputs]
    [[plot_map_sst_hycomglo12]]
        plot = plot_map_metr_RMSE
        colormap = thermal
        attribute = SST
        vmin = 0
        vmax = 1 
        dvmin = 0
        dvmax = +2

