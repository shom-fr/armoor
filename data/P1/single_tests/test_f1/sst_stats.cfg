functionality = sst
colocate = observation
output_path = ./

[observation]
    name = "TEMP"
    path = ../data/test_f1/OBS/extract_METOFFICE-GLO-SST-L4-REP-OBS-SST_2020.nc
    method = nearest
[models]
    [[PSY4]]
        name = PSY4
        path = ../data/test_f1/MODEL/extract_sst_mercator_2020.nc
        method = nearest

[meta_zone]
    name = Meta-zone_polygon
    polygon = [51.8,15.8], [41.2, 12.],[44.7, 9.8], [51., 11.8]


    start = 2020-01-01T00:00:00.000000000
    end = 2020-12-30T00:00:00.000000000

[outputs]
    [[plot_ts_metr_stats]]
        plot = plot_ts_metr_stats
    [[plot_map_biais]]
        plot = plot_map_metr_ecart
        colormap = solar
        attribute = SST
