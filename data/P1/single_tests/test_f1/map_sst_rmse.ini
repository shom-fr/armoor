functionality = sst
colocate = observation

[observation]
    name = "TEMP"
    path = ../data/test_f1/OBS/nov_METEOFRANCE-EUR-SST_L3MONOSENSOR_NRT-OBS_V2-AVHRR_METOP_B_FULL_TIME_SERIE_1621503492101_2.nc
    method = nearest

[models]
    [[NEMO]]
        name = NEMO
        path = ../data/test_f1/MODEL/global-analysis-forecast-phy-001-024-3dinst-thetao_20200601.nc
        method = nearest

[meta-zones]
    name = "Polygon, interval, start and end time."
    polygon = [-6,49], [-6, 47],[-4, 47], [-4, 49]
    start = 2020-06-01T00:00:00
    end = 2020-06-04T03:00:00
    interval = 12h

[outputs]
    [[plot_map_RMSE]]
        plot = plot_map_metr_RMSEc
        colormap = solar
        attribute = SST










