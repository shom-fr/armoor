[report]
    title = Bulletin de validation f7
    format = pdf

[functionalities]
    [[f7_ellipses]]
        path_to_config = test_f7/ellipses.ini
        meta_zones = meta_zone_2
    [[f7_ellipses_tranche]]
        path_to_config = test_f7/ellipses_tranche.ini
        meta_zones = meta_zone_1
    [[f7_harmonic_table_et_table_tanche]]
        path_to_config = test_f7/harmonic_table.ini
        meta_zones = meta_zone_0, meta_zone_1
    [[f7_hovmoller_datashom]]
        path_to_config = test_f7/hovmoller_datashom.ini
        meta_zones = meta_zone_0
    [[f7_hovmoller_LADCP]]
        path_to_config = test_f7/hovmoller_LADCP.ini
        meta_zones = meta_zone_0
    [[f7_hovmoller_datashom_bathyradius]]
        path_to_config = test_f7/hovmoller_datashom_bathyradius.ini
        meta_zones = meta_zone_3

[meta_zones]
    [[meta_zone_0]]
        name = meta-zone empty
        description = meta-zone empty
    [[meta_zone_1]]
        name = meta-zone 1
        description = meta-zone 1
        depth = 0,100
        slice = 10
    [[meta_zone_2]]
        name = meta-zone 2
        description = meta-zone 2
        depth = 0, 50
    [[meta_zone_3]]
        name = meta-zone 3
        description = meta-zone 3
        bathy = 50
        radius = 100