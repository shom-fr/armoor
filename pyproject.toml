[project]
name = "armoor"
authors = [
    {name = "Shom", email = "mathieu.morvan@shom.fr"},
]
license-files = ["LICENSE.rst"]
description = "Analysis of Regional MOdelised and ObseRved ocean"
dynamic = ["version"]
readme = "README.rst"
classifiers = [
    "Development Status :: 1 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research/Production",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Oceanographic Science"
]
requires-python = ">=3.11"
dependencies = [
    # xoa now comes from conda-forge (see requirements.txt/environment.yml,
    # pinned to 2026.7.0) -- woom/shoot have no conda-forge package, stay git-based.
    "woom @ git+https://github.com/shom-fr/woom.git",
    "shoot @ git+https://github.com/shom-fr/shoot.git@develop"
]
[project.optional-dependencies]

doc = [
  "sphinx",
  "sphinx-argparse",
  "sphinx-book-theme",
  "sphinx-gallery",
  "sphinx_rtd_theme",
  "sphinxcontrib-applehelp",
  "sphinxcontrib-autoprogram",
  "sphinxcontrib-devhelp",
  "sphinx-design",
  "sphinxcontrib-htmlhelp",
  "sphinxcontrib-jquery",
  "sphinxcontrib-jsmath",
  "sphinxcontrib-programoutput",
  "sphinxcontrib-qthelp",
  "sphinxcontrib-serializinghtml",
]

[project.urls]
homepage = "https://gitshom.gitlab.io/STM/armoor/"
issue-tracker = "https://gitlab.com/GitShom/STM/armoor/-/issues"
source-code = "https://gitlab.com/GitShom/STM/armoor"


[project.scripts]
armoor-bull = "armoor.cli.main:main_bull"
armoor-coloc-time = "armoor.cli.coloc:main_coloc_time"
armoor-coloc-horizontal = "armoor.cli.coloc:main_coloc_horizontal"
armoor-coloc-vertical = "armoor.cli.coloc:main_coloc_vertical"
armoor-comp = "armoor.cli.comp:main_comp"
armoor-comp-argo = "armoor.cli.main:main_comp_argo"
armoor-comp-clim = "armoor.cli.main:main_comp_clim"
armoor-comp-drifter = "armoor.cli.main:main_comp_drifter"
armoor-comp-models = "armoor.cli.main:main_comp_models"
armoor-comp-mooring = "armoor.cli.main:main_comp_mooring"
armoor-comp-sst = "armoor.cli.main:main_comp_sst"
armoor-data = "armoor.cli.main:main_data"
armoor-decode = "armoor.cli.decode:main_decode"
armoor-filters = "armoor.cli.main:main_filters"
armoor-filters-time = "armoor.cli.filters:main_filters_time"
armoor-filters-horizontal = "armoor.cli.filters:main_filters_horizontal"
armoor-filters-quality = "armoor.cli.filters:main_filters_quality"
armoor-filters-oceanvars = "armoor.cli.filters:main_filters_oceanvars"
armoor-interp-time = "armoor.cli.interp:main_interp_time"
armoor-interp-horizontal = "armoor.cli.interp:main_interp_horizontal"
armoor-interp-vertical = "armoor.cli.interp:main_interp_vertical"
armoor-range-time = "armoor.cli.range:main_range_time"
armoor-range-vertical = "armoor.cli.range:main_range_vertical"
armoor-viewer = "armoor.viewer.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "armoor", "armoor.accessors", "armoor.algo", "armoor.base",
    "armoor.cli", "armoor.comp", "armoor.data", "armoor.diags",
    "armoor.viewer", "armoor.viewer.api", "armoor.viewer.rendering", "armoor.viewer.bridge",
]
include-package-data = true

[tool.setuptools.package-data]
"armoor.viewer" = ["static/**/*", "static/*", "data/*"]
"*" = ["*.ini", "*.cfg"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
write_to = "armoor/_version.py"
tag_regex= "^(?P<prefix>v)?(?P<version>[^\\+]+)(?P<suffix>.*)?$"

[tool.pytest.ini_options]
filterwarnings = [
    # xarray converts non-nanosecond datetime64 values to ns internally.
    # The conversion is correct; the warning is noise in test output.
    "ignore:Converting non-nanosecond precision datetime values:UserWarning",
]

[tool.flake8]
max-line-length = 100
ignore = [
    "E203",  # whitespace before ':'
    "E402",  # module level import not at top of file
    "E501",  # line too long - let black worry about that
    "E731",  # do not assign a lambda expression, use a def
    "W503"   # line break before binary operator
]
exclude = [
    ".eggs",
    "doc"
]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true
