[parameters]
    [[__many__]]
    name = string
        [[[extent]]]
            lon_min = float
            lon_max = float
            lat_min = float
            lat_max = float
        [[[__many__]]]
            name = string
            func = option(visu_temp, visu_sal, visu_current, visu_diff_sst, visu_windforcing, visu_solarflux, visu_diff_sss, visu_runoff, visu_precip, visu_mixedlayer, visu_mixedlayer_clim)
            var = option(temp, sst, uv, suv, sal, sss, hfsen, RVFL, tp)
            obs = string
            depth = float(default=None)
            forcing_model = string
            rarification = int(default=1)
            multiprocess = boolean(default=True)

[config_reg]
    name = string