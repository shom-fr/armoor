name: armoor_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python
  - uvicorn
  - pycryptodome
  - sphinx
  - sphinx_rtd_theme
  - jinja2
  - PyPDF2
  - weasyprint
  - pydantic
  - ldap3
  - fastapi
  - python-gitlab
  - cartopy
  - matplotlib
  - xesmf
  - xoa
  - dask
  - geojson
  - configobj=5.0.6
  - opendrift=1.10.5
  - cfgrib
  - pip
  - pip:
    - pylint
    - xoa-999-py3-none-any.whl
    - pytest
    - setuptools
    - build
