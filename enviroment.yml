name: armoor_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python
  - sphinx
  - sphinx_rtd_theme
  - jinja2
  - PyPDF2
  - weasyprint
  - pydantic
  - ldap3
  - fastapi
  - python-gitlab
  - cartopy
  - matplotlib
  - xesmf
  - xoa
  - dask
  - geojson
  - configobj=5.0.6
  - opendrift
  - pip:
    - pylint
    - pytest
    - setuptools
    - build
