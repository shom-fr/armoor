[get_woa18]
    # Téléchargement des fichiers WOA18 pour le mois courant
    # Base URL : https://www.ncei.noaa.gov/data/oceans/woa/WOA18/DATA/{variable}/netcdf/decav/1.00/
    # Fichiers mensuels : woa18_decav_t{MM}_01.nc (temp) / woa18_decav_s{MM}_01.nc (sal), MM = 01..12
    commandline = """
    MM=$(date +%m) ;
    wget -q -O woa18_temp.nc https://www.ncei.noaa.gov/data/oceans/woa/WOA18/DATA/temperature/netcdf/decav/1.00/woa18_decav_t${MM}_01.nc ;
    wget -q -O woa18_sal.nc  https://www.ncei.noaa.gov/data/oceans/woa/WOA18/DATA/salinity/netcdf/decav/1.00/woa18_decav_s${MM}_01.nc
    """
    run_dir = {scratch_dir}/comp_clim

[comp_clim]
    depends = get_woa18, get_cmems_glo12_temp, get_cmems_glo12_sal
    commandline = """
    ln -sf {model_temp} {model_sal} {woa18_temp} {woa18_sal} . ;
    armoor-comp-clim meta_clim \
        $WOOM_WORKFLOW_DIR/comp_clim.cfg \
        -m $WOOM_WORKFLOW_DIR/metazones.cfg \
        --tbound 2023-01-01T00:00:00 2023-12-31T23:59:59
    """
    run_dir = {scratch_dir}/comp_clim
