[local]
patterns=*vbtl*
module_setup=. /etc/profile.d/modules.sh
     [[dirs]]
     scratch=$HOME/armoor_tests
     run_dir={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             [[[[modules]]]]
             use=/local/modulefiles/conda3/
             load=armoor-py3.11
             
[sl-hycom-prod]
patterns=sl-hycom-prod*
module_setup=. /etc/profile.d/modules.sh
     [[dirs]]
     scratch=/data3/Public/armoor_tests
     run_dir={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             [[[[modules]]]]
             use=/data3/Public/Modulefiles/conda3
             load=armoor-py3.11
            
[gitlab-ci]
patterns=runner-*
     [[dirs]]
     scratch=$CI_PROJECT_DIR/armoor_tests
     run_dir={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             raw_text="""source /opt/conda/etc/profile.d/conda.sh; \
             source activate $CI_PROJECT_DIR/armoor_env
             """
         [[[[vars]]]]
                [[[[[append]]]]]
                PYTHONPATH=$PWD

# GitHub-hosted runners (.github/workflows/ci.yml): conda env "armoor-env"
# created by conda-incubator/setup-miniconda, which exports $CONDA.
[github-actions]
patterns=fv-az*,runnervm*,*.cloudapp.net
     [[dirs]]
     scratch=$HOME/armoor_tests
     run_dir={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             raw_text="""source $CONDA/etc/profile.d/conda.sh; \
             conda activate armoor-env
             """

[belenos]
patterns=belenoslogin*,*.belenoshpc.meteo.fr
scheduler=slurm
     [[dirs]]
     scratch=/scratch/work/$USER/armoor_tests
     run_dir={{ scratch_dir }}
     [[envs]]
         [[[armoor]]]
             [[[[modules]]]]
             use=$HOME/Public/Modulefiles/miniforge3
             load=armoor-py3.11

[datarmor]
patterns=datavisu*,datarmor*,*.ifremer.fr
scheduler=pbspro
     [[dirs]]
     scratch=$DATAWORK/armoor_tests
     run_dir={{ scratch_dir }}

